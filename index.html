document.addEventListener('paste', e => {
  const top = S.stack[S.stack.length - 1]; if (!top || !canEdit()) return;
  const itens = Array.from((e.clipboardData && e.clipboardData.items) || []);
  const img = itens.find(x => x.kind === 'file' && /^image\//.test(x.type)); if (!img) return;
  const t = e.target, emTexto = t && (t.tagName === 'TEXTAREA' || (t.tagName === 'INPUT' && !/^(file|checkbox|radio|button)$/.test(t.type || '')));
  if (emTexto && itens.some(x => x.type === 'text/plain')) return;         // colando texto num campo: deixa normal
  const file = img.getAsFile(); if (!file) return;
  e.preventDefault(); colarImagem(top, file);
});
async function colarImagem(top, file){
  try {
    const ed = S.editor;
    if (top.type === 'kitedit' && ed && ed.kind !== 'peca'){
      if (ed.alvo === 'etq'){ toast('Enviando a etiqueta…', null, 2000); const p = await DB.upload(file, 'kits/' + slug(ed.kit.cod_cliente || 'novo') + '/etiqueta-' + Date.now() + '.jpg'); if (S.editor !== ed) return; ed.kit.etiqueta_path = p; ed.dirty = true; $('#edEtq').innerHTML = etqBox(); return toast('Etiqueta colada. Confira e salve.'); }
      if (ed.alvo === 'ficha'){ toast('Enviando a foto…', null, 2000); const p = await DB.upload(file, 'kits/' + slug(ed.kit.cod_cliente || 'novo') + '/foto-' + Date.now() + '.jpg'); if (S.editor !== ed) return; ed.fotos.push({ id:null, caminho:p, itens:[], legenda:'' }); ed.dirty = true; drawEdFotos(); return toast('Foto da ficha colada. Diga quais itens aparecem nela.'); }
      const it = Number.isInteger(ed.alvo) ? ed.itens[ed.alvo] : null;
      if (!it) return toast('Clique no item onde vai a foto e cole de novo (Ctrl+V).', null, 5000);
      if (!String(it.codigo || '').trim()) return toast('Digite o código da peça do item ' + it.item + ' antes de colar a foto.', null, 5000);
      setItemFoto(it, file, 'upload'); ed.dirty = true; drawFotoStrip(ed.alvo);
      return toast('Foto colada no item ' + it.item + '. Confira e salve.');
    }
    if (top.type === 'peca' || (top.type === 'pecaedit' && ed && ed.id)){
      const id = top.type === 'peca' ? top.id : ed.id, p = S.pecaById.get(id);
      toast('Enviando a foto…', null, 2000);
      const path = await DB.upload(file, 'pecas/' + slug(p ? p.codigo : 'peca-' + id) + '-' + Date.now() + '.jpg');
      await DB.setPecaFoto(id, path); await reloadLists(); S.stack.forEach(s => { s.reload = true; }); renderSheet(true);
      return toast('Foto da peça trocada (vale para todos os kits com ela).');
    }
    if (top.type === 'kit') return toast('Para colar a foto: toque em Editar, clique no item e cole (Ctrl+V).', null, 5000);
  } catch(err){ toast(errMsg(err)); }
}
document.addEventListener('selectstart', e => { if (document.body.classList.contains('arrastando')) e.preventDefault(); });   // arrastando foto: não seleciona texto
document.addEventListener('keydown', e => {
  if (fzvAberta()){   // ficha ampliada: Esc fecha, + e - mudam o zoom, 0 = página inteira, 1 = tamanho real
    if (e.key === 'Escape') return fecharFichaZoom();
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const z = { '+':'+', '=':'+', '-':'-', '0':'pagina', '1':'1' }[e.key]; if (!z) return; e.preventDefault();
    if (z === '+' || z === '-') fzvPasso(z === '+' ? 1 : -1); else fzvZoom(z === 'pagina' ? fzvFit('pagina') : 1); return;
  }
  if (e.key === 'Escape'){ if ($('#viewer').classList.contains('open')) return closeViewer(); if (S.stack.length) return popSheet(); }
  if (e.target.id === 'calcQ' && e.key === 'Enter'){ e.preventDefault(); ACT['calc-add'](); }
  if (e.target.id === 'dupCod' && e.key === 'Enter'){ e.preventDefault(); const b = $('[data-act="dup-do"]'); if (b) b.click(); }
});
document.addEventListener('submit', e => {
  if (e.target.id !== 'loginForm') return; e.preventDefault();

(function pinch(){
  let d0 = 0, z0 = 1;
  document.addEventListener('touchstart', e => { if (!$('#viewer').classList.contains('open') || e.touches.length !== 2) return; d0 = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY); z0 = V.zoom; }, { passive:true });
  document.addEventListener('touchmove', e => { if (!d0 || e.touches.length !== 2) return; e.preventDefault(); const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY); V.zoom = Math.min(4, Math.max(1, z0 * d / d0)); applyZoom(); }, { passive:false });
  document.addEventListener('touchend', e => { if (e.touches.length < 2) d0 = 0; });
})();

let DB = null;

    + (pub ? '<button class="btn small" type="button" data-act="lg-public">Só consultar, sem entrar</button>' : '') + '</form></div>';
}
function setupHtml(msg, titulo){
  return '<div class="card" id="setupCard" style="max-width:720px;margin:24px auto;display:flex;flex-direction:column;gap:12px"><h2 style="font-size:24px">' + esc(titulo || 'Falta preparar o banco') + '</h2>'
    + '<p style="margin:0">A página abriu, mas o banco no Supabase ainda não está na versão desta página.</p><ol style="margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px"><li>No Supabase, abra <b>SQL Editor</b>, cole o arquivo <span class="mono">criar_banco_calculadora.sql</span> inteiro e clique em <b>Run</b>. Pode rodar de novo: não apaga dados.</li><li>Recarregue esta página.</li></ol>'
    + '<p class="muted" style="margin:0;font-size:13px">Detalhe técnico: ' + esc(msg) + '</p><div><button class="btn primary" type="button" onclick="location.reload()">Tentar de novo</button></div></div>';
}
let started = false;
async function start(){
  document.body.classList.remove('auth-off');
  $('#view').innerHTML = '<div class="loading">Carregando cadastro…</div>';
  try {
    const b = await DB.init();
    Object.assign(S, { cfg:b.cfg || {}, me:b.me, clientes:b.clientes || [], predios:b.predios || [], familias:b.familias || [] });
    await reloadLists();
    S.avisos = await DB.avisos().catch(() => []);
  } catch(e){
    $('#view').innerHTML = S.mode === 'supabase' ? setupHtml(errMsg(e)) : '<div class="card empty">Não consegui abrir: ' + esc(errMsg(e)) + '</div>';
    setDb('Banco com problema', false); return;
  }
  setDb(S.mode === 'demo' ? 'Demonstração (navegador)' : 'Supabase · conectado' + (openMode() ? ' · sem login' : ''), S.mode !== 'demo');
  if (openMode() && !S.me.nome) setTimeout(() => pushSheet({ type:'nome' }), 300);
  calcLoad();
  const h = location.hash.slice(1); go(VIEWS[h] ? h : 'kits');
  runCalc();
  if (!started && S.mode === 'supabase' && DB.subscribe){
    DB.subscribe(a => { S.avisos.unshift(a); renderNav(); if (!S.me || a.por_nome !== S.me.nome) toast(a.titulo); }, debounce(() => reloadLists({ pend:false }), 1500));
  }
  started = true;
}
async function probeRef(){
  // usa a primeira pasta que tiver as páginas do catálogo: junto do index.html (GitHub) ou no Storage do Supabase
  for (const base of [CONFIG.refImgBase, CONFIG.refImgAlt].filter(Boolean)){
    const ok = await new Promise(r => { const im = new Image(); const t = setTimeout(() => r(false), 4000); im.onload = () => { clearTimeout(t); r(true); }; im.onerror = () => { clearTimeout(t); r(false); }; im.src = base + 's000.webp'; });
    if (ok){ CONFIG.refImgBase = base; return; }
  }
}
(async function boot(){
  const th = lsGet('ju_theme', null); if (th) document.documentElement.dataset.theme = th;
  if (IN_ARTIFACT){ try { S.downloads = await window.claude.use('downloads'); } catch(e){} }
  if (S.mode === 'demo'){ DB = LocalStore(); await start(); return; }
  if (!window.supabase){ $('#view').innerHTML = setupHtml('A biblioteca do Supabase não carregou (internet bloqueando cdn.jsdelivr.net?).'); return; }
  DB = SupaStore();
  DB.onAuth(ev => { if (ev === 'PASSWORD_RECOVERY') pushSheet({ type:'novasenha' }); });
  setDb('Supabase · entrando…', false);
  let ses = null; try { [, ses] = await Promise.all([probeRef(), DB.session()]); } catch(e){}
  if (ses) return start();
  const cfg = await DB.publicConfig();
  if (cfg.acesso_livre) return start();          // sem login por enquanto
  if (cfg.acesso_livre !== false){               // SQL antigo (sem acesso_livre) ou banco fora do ar: explica em vez de mostrar o login
    setDb('Banco desatualizado', false);
    $('#view').innerHTML = setupHtml(cfg.__erro || 'config.acesso_livre não existe: o banco ainda está com o SQL antigo, que exige login.', 'Falta atualizar o banco');
    return;
  }
  renderLogin('', !!cfg.leitura_publica);        // login ligado de propósito (acesso_livre = false)
})();
})();
