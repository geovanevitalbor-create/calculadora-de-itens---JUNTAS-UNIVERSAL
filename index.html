<!doctype html>
<html lang="pt-BR">
<head>
<meta name="theme-color" content="#22A559">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calculadora de Fabricação</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Juntas Universal — Calculadora de Fabricação com cadastro de fichas no estilo do catálogo.
   Celular: barra inferior com botão verde central (Calcular). Computador: menu lateral. */
:root{
  --bg:#F5F7F9; --surface:#FFFFFF; --surface-2:#F0F2F5; --line:#E1E5EA; --ink:#0F1720; --ink-2:#5B6572; --ink-3:#8A939E;
  --accent:#22A559; --accent-hover:#1C8A4A; --accent-ink:#177A3F; --accent-soft:#E3F7EA; --on-accent:#FFFFFF;
  --ok:#177A3F; --ok-soft:#E3F7EA; --warn:#A65F00; --warn-soft:#FFF3DC; --info:#2160C4; --info-soft:#E8F0FC;
  --crit:#C9363B; --crit-soft:#FDECEC; --violet:#6A4CBF; --violet-soft:#EFEAFB; --neutral:#5B6572; --neutral-soft:#EEF0F3;
  --paper:#FFFFFF; --scrim:rgba(15,23,32,.45); --viewer-bg:#0B0F14;
  --shadow:0 1px 2px rgba(16,24,32,.06), 0 1px 1px rgba(16,24,32,.04);
  --shadow-btn:0 2px 6px rgba(34,165,89,.28);
  --shadow-lg:0 12px 36px rgba(16,24,32,.18);
  --f-display:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --f-body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --f-mono:"SF Mono","Roboto Mono",Consolas,monospace;
  --r:14px; --r-sm:10px; --rail:236px; --tab:64px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0D1117; --surface:#161B22; --surface-2:#1C2128; --line:#2D333B; --ink:#E6EDF3; --ink-2:#8B949E; --ink-3:#6E7681;
  --accent:#2EA043; --accent-hover:#3FB950; --accent-ink:#56D364; --accent-soft:rgba(46,160,67,.16); --on-accent:#FFFFFF;
  --ok:#56D364; --ok-soft:rgba(46,160,67,.16); --warn:#E3B341; --warn-soft:rgba(227,179,65,.14); --info:#79A9F5; --info-soft:rgba(121,169,245,.14);
  --crit:#F85149; --crit-soft:rgba(248,81,73,.14); --violet:#B39CF0; --violet-soft:rgba(179,156,240,.14); --neutral:#8B949E; --neutral-soft:rgba(139,148,158,.14);
  --paper:#F4F4F1; --scrim:rgba(0,0,0,.6); --viewer-bg:#05080B;
  --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-btn:0 2px 10px rgba(46,160,67,.35); --shadow-lg:0 12px 36px rgba(0,0,0,.55); color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0D1117; --surface:#161B22; --surface-2:#1C2128; --line:#2D333B; --ink:#E6EDF3; --ink-2:#8B949E; --ink-3:#6E7681;
  --accent:#2EA043; --accent-hover:#3FB950; --accent-ink:#56D364; --accent-soft:rgba(46,160,67,.16); --on-accent:#FFFFFF;
  --ok:#56D364; --ok-soft:rgba(46,160,67,.16); --warn:#E3B341; --warn-soft:rgba(227,179,65,.14); --info:#79A9F5; --info-soft:rgba(121,169,245,.14);
  --crit:#F85149; --crit-soft:rgba(248,81,73,.14); --violet:#B39CF0; --violet-soft:rgba(179,156,240,.14); --neutral:#8B949E; --neutral-soft:rgba(139,148,158,.14);
  --paper:#F4F4F1; --scrim:rgba(0,0,0,.6); --viewer-bg:#05080B;
  --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-btn:0 2px 10px rgba(46,160,67,.35); --shadow-lg:0 12px 36px rgba(0,0,0,.55); color-scheme:dark; }

*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--surface)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
h1,h2,h3{font-family:var(--f-display);font-weight:800;letter-spacing:-.01em;text-wrap:balance;margin:0}
.eyebrow{font-weight:700;font-size:12.5px;color:var(--ink-2)}

/* ---------- shell ---------- */
.rail{display:none}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px;min-height:56px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brandmark{width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-weight:800;font-size:12.5px;letter-spacing:.02em;flex-shrink:0}
.topbar .ttl{display:flex;flex-direction:column;min-width:0;flex:1}
.topbar .ttl b{font-size:17px;font-weight:800;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .ttl span{font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{position:relative;width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex-shrink:0;color:var(--ink)}
.iconbtn:hover{background:var(--surface-2)}
.iconbtn svg{width:20px;height:20px}
.badge{position:absolute;top:-5px;right:-5px;min-width:19px;height:19px;padding:0 5px;border-radius:999px;background:var(--crit);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;border:2px solid var(--surface)}
.badge.dot{min-width:11px;width:11px;height:11px;padding:0;top:-2px;right:-2px}
main{padding-block:16px calc(var(--tab) + 24px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1320px;margin:0 auto}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:35;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);box-shadow:0 -4px 18px rgba(16,24,32,.06)}
.tab{position:relative;height:var(--tab);border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--ink-2);font-weight:600;font-size:11px;min-width:0}
.tab .ic{position:relative;display:grid;place-items:center}
.tab svg{width:23px;height:23px}
.tab .lb{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;padding:0 2px}
.tab[aria-current="page"]{color:var(--accent)}
.tab[aria-current="page"] .lb{font-weight:800}
.tab .ic .badge{top:-7px;right:-12px}
.fab-slot{position:relative;height:var(--tab);border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 0 9px;color:var(--ink);font-weight:800;font-size:11px}
.fab-slot .fab{position:absolute;top:-20px;left:50%;transform:translateX(-50%);width:56px;height:56px;border-radius:18px;background:var(--accent);color:#fff;display:grid;place-items:center;
  box-shadow:0 8px 18px rgba(34,165,89,.42),0 0 0 5px var(--surface);transition:transform .12s ease,background .12s ease}
.fab-slot .fab svg{width:28px;height:28px}
.fab-slot:hover .fab{background:var(--accent-hover)}
.fab-slot[aria-current="page"]{color:var(--accent)}
.fab-slot[aria-current="page"] .fab{background:var(--accent-hover);box-shadow:0 8px 18px rgba(34,165,89,.5),0 0 0 5px var(--surface),0 0 0 7px var(--accent-soft)}
.fab-slot:active .fab{transform:translateX(-50%) scale(.95)}
.rail-add{width:100%;margin:0 0 14px}
@media (min-width:900px){
  .tabbar{display:none}
  .rail{display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;width:var(--rail);z-index:36;background:var(--surface);border-right:1px solid var(--line);
    padding:calc(18px + env(safe-area-inset-top,0px)) 14px calc(16px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
  .rail .brand{display:flex;gap:11px;align-items:center;padding:0 6px 22px}
  .rail .brand b{font-size:14.5px;font-weight:800;line-height:1.3;display:block;letter-spacing:-.01em}
  .rail .brand span{font-size:11.5px;font-weight:600;color:var(--ink-2)}
  .rail nav{display:flex;flex-direction:column;gap:4px}
  .rail .tab{height:auto;flex-direction:row;justify-content:flex-start;gap:11px;padding:10px 14px;border-radius:10px;font-size:13.5px;color:var(--ink-2)}
  .rail .tab:hover{background:var(--surface-2);color:var(--ink)}
  .rail .tab[aria-current="page"]{background:var(--accent);color:#fff;box-shadow:var(--shadow-btn)}
  .rail .tab[aria-current="page"]::before{display:none}
  .rail .tab[aria-current="page"] .badge{background:#fff;color:var(--accent-ink)}
  .rail .tab .badge{position:static;margin-left:auto;border:0}
  .rail .foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;font-size:12.5px;color:var(--ink-3);padding:0 6px}
  .rail .foot .stamp{border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--ink-2)}
  .rail .foot .stamp b{display:block;font-size:13px;font-weight:800;color:var(--ink)}
  .topbar,main{margin-left:var(--rail)}
  .topbar .brandmark{display:none}
  main{padding-bottom:40px;padding-top:22px}
}
.dbline{display:flex;gap:7px;align-items:center}
.dbline i{width:8px;height:8px;border-radius:50%;background:var(--ink-3);flex-shrink:0}
.dbline.on i{background:var(--ok)}

/* ---------- generic ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;padding:10px 18px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:14px;white-space:nowrap;transition:background .12s ease,transform .08s ease,box-shadow .12s ease}
.btn:hover{background:var(--surface-2)}
.btn svg{width:18px;height:18px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);box-shadow:var(--shadow-btn)}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn:active{transform:scale(.98)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn.small{min-height:36px;padding:7px 13px;font-size:13px;border-radius:10px}
.btn.danger{color:var(--crit)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.field{width:100%;min-height:46px;padding:11px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-size:14.5px}
.field:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search{position:relative}
.search svg{position:absolute;left:12px;top:50%;width:18px;height:18px;transform:translateY(-50%);color:var(--ink-3);pointer-events:none}
.search .field{padding-left:38px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.chip{flex-shrink:0;display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:6px 13px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:13px;color:var(--ink-2)}
.chip b{font-variant-numeric:tabular-nums;color:var(--ink-3);font-weight:600}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:var(--shadow-btn)}
.chip[aria-pressed="true"] b{color:inherit;opacity:.75}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap;background:var(--neutral-soft);color:var(--neutral)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.t-ok{background:var(--ok-soft);color:var(--ok)} .t-warn{background:var(--warn-soft);color:var(--warn)} .t-info{background:var(--info-soft);color:var(--info)}
.t-crit{background:var(--crit-soft);color:var(--crit)} .t-violet{background:var(--violet-soft);color:var(--violet)} .t-neutral{background:var(--neutral-soft);color:var(--neutral)}
.dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;background:var(--neutral)}
.dot.t-ok{background:var(--ok)} .dot.t-warn{background:var(--warn)} .dot.t-info{background:var(--info)} .dot.t-crit{background:var(--crit)} .dot.t-violet{background:var(--violet)}
.muted{color:var(--ink-3)}
.empty{padding:26px 12px;text-align:center;color:var(--ink-3)}
.callout{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--ink-2);font-family:var(--f-mono);font-size:11.5px;font-weight:700;color:var(--ink-2);flex-shrink:0}
.notice{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border-radius:10px;background:var(--warn-soft);color:var(--ink);font-size:14px}
.notice.info{background:var(--info-soft)}
.notice svg{width:18px;height:18px;flex-shrink:0;margin-top:2px;color:var(--warn)}
.notice.info svg{color:var(--info)}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 0 10px}
.section-h h2{font-size:16px}
.page-thumb{display:block;aspect-ratio:595.3/841.9;max-width:100%;background-color:var(--paper);background-repeat:no-repeat;background-size:100% 300%;border-radius:4px;box-shadow:0 0 0 1px var(--line);flex-shrink:0}
/* ---------- produção ---------- */
.calc{display:grid;gap:16px}
@media (min-width:1180px){ .calc{grid-template-columns:minmax(330px,400px) minmax(0,1fr);align-items:start} .calc-left{position:sticky;top:78px} }
.calc-left{display:flex;flex-direction:column;gap:14px;min-width:0}
.calc-right{display:flex;flex-direction:column;gap:14px;min-width:0}
.combo{position:relative}
.combo-list{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:20;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-lg);max-height:360px;overflow:auto;padding:6px}
.combo-opt{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:9px 10px;border-radius:9px}
.combo-opt:hover,.combo-opt.on{background:var(--surface-2)}
.combo-opt .mono{font-weight:700;min-width:76px}
.combo-opt .d{font-size:13px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.add-row{display:flex;gap:8px;margin-top:10px;align-items:center}
.add-row .field{width:110px;flex-shrink:0}
.add-row .btn{flex:1}
.drop{border:1.5px dashed var(--line);border-radius:12px;padding:14px;display:flex;gap:12px;align-items:center;background:var(--surface-2)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop svg{width:26px;height:26px;color:var(--ink-3);flex-shrink:0}
.drop p{margin:0;font-size:13.5px;color:var(--ink-2);flex:1}
.drop p b{color:var(--ink)}
.drop .acts{display:flex;gap:6px;flex-wrap:wrap}
.prod-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.prod-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:min(52vh,520px);overflow:auto}
.prod-item{display:grid;grid-template-columns:auto minmax(0,1fr) 92px 34px;gap:10px;align-items:center;padding:8px 8px 8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.prod-item .who{border:0;background:none;text-align:left;padding:0;min-width:0}
.prod-item .who b{font-family:var(--f-mono);font-size:14px;display:block}
.prod-item .who span{display:block;font-size:12.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prod-item input{width:100%;min-height:38px;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);text-align:right;font-family:var(--f-mono);font-weight:700}
.x{width:34px;height:34px;border-radius:8px;border:0;background:none;color:var(--ink-3);display:grid;place-items:center}
.x:hover{background:var(--crit-soft);color:var(--crit)}
.x svg{width:16px;height:16px}
.example{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:9px 12px;border-radius:10px;background:var(--violet-soft);color:var(--ink);font-size:13.5px;margin-bottom:10px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:700px){ .tiles{grid-template-columns:repeat(4,minmax(0,1fr))} }
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow)}
.tile .v{font-weight:800;font-size:26px;line-height:1.15;font-variant-numeric:tabular-nums}
.tile .l{font-size:11.5px;color:var(--ink-2);font-weight:700}
.tile.hl .v{color:var(--accent)}
.tile.warn .v{color:var(--warn)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar .search{flex:1;min-width:180px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;padding:3px;background:var(--surface)}
.seg button{border:0;background:none;padding:7px 12px;border-radius:7px;font-weight:600;font-size:13.5px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface-2);color:var(--ink)}
.group{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.group-h{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.group-h h3{font-size:14.5px}
.group-h .meta{margin-left:auto;font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.group-h .sw{width:12px;height:12px;border-radius:3px}
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.prow:last-child{border-bottom:0}
.prow:hover{background:var(--surface-2)}
.prow .c{font-family:var(--f-mono);font-weight:700;font-size:14.5px;display:flex;gap:8px;align-items:center;min-width:0;flex-wrap:wrap}
.prow .tot{font-weight:800;font-size:19px;color:var(--accent-ink);line-height:1;text-align:right;font-variant-numeric:tabular-nums;grid-row:span 2;align-self:center}
.prow .tot small{display:block;font-family:var(--f-body);font-size:11.5px;font-weight:600;color:var(--ink-3)}
.prow .a{font-size:13px;color:var(--ink-2)}
.prow .u{grid-column:1/-1;display:flex;gap:5px;flex-wrap:wrap}
.kchip{font-family:var(--f-mono);font-size:11.5px;padding:2px 7px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
.tag{font-size:11.5px;font-weight:700;padding:1px 7px;border-radius:5px;background:var(--surface-2);color:var(--ink-2);font-family:var(--f-body)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
@media (min-width:760px){
  .prow{grid-template-columns:minmax(150px,1.1fr) minmax(0,1.5fr) minmax(0,1.6fr) 96px;align-items:center}
  .prow .tot{grid-row:auto}
  .prow .u{grid-column:auto}
}
.p-fab1{background:#1E8C78} .p-fab2{background:#4458B5} .p-both{background:#6E7F8B} .p-compras{background:#B87A10} .p-terc{background:#9A4FA6} .p-none{background:var(--crit)}

/* ---------- kits ---------- */
.list-head{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.kit-grid{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:640px){ .kit-grid{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (min-width:1280px){ .kit-grid{grid-template-columns:repeat(3,minmax(0,1fr))} }
.kcard{display:grid;grid-template-columns:76px minmax(0,1fr);gap:12px;text-align:left;padding:11px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);align-items:start;box-shadow:var(--shadow)}
.kcard:hover{border-color:var(--ink-3);box-shadow:var(--shadow)}
.kcard .page-thumb{width:76px}
.kcard .noimg{width:76px;aspect-ratio:595.3/841.9;border-radius:4px;border:1.5px dashed var(--line);display:grid;place-items:center;color:var(--ink-3);font-size:11px;text-align:center;padding:4px}
.kcard .top{display:flex;align-items:center;gap:8px;justify-content:space-between;flex-wrap:wrap}
.kcard .cod{font-family:var(--f-mono);font-weight:700;font-size:14.5px}
.kcard .desc{font-size:13.5px;color:var(--ink-2);margin:5px 0 7px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.kcard .foot{display:flex;gap:10px;font-size:12px;color:var(--ink-3);flex-wrap:wrap}
.more{display:flex;justify-content:center;margin-top:14px}

/* ---------- peças ---------- */
.plist{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.pitem{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 12px;padding:11px 14px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%}
.pitem:last-child{border-bottom:0}
.pitem:hover{background:var(--surface-2)}
.pitem .c{font-family:var(--f-mono);font-weight:700;font-size:14.5px}
.pitem .n{font-size:17px;font-weight:800;text-align:right;line-height:1}
.pitem .n small{display:block;font-family:var(--f-body);font-size:11px;color:var(--ink-3);font-weight:600}
.pitem .a{font-size:13px;color:var(--ink-2);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
/* ---------- sheet (detail stack) ---------- */
.layer{position:fixed;inset:0;z-index:50;pointer-events:none}
.layer .scrim{position:absolute;inset:0;background:var(--scrim);opacity:0;transition:opacity .2s}
.layer.open{pointer-events:auto}
.layer.open .scrim{opacity:1}
.panel{position:absolute;left:0;right:0;bottom:0;top:max(28px,env(safe-area-inset-top,0px));background:var(--bg);border-radius:18px 18px 0 0;box-shadow:var(--shadow-lg);
  display:flex;flex-direction:column;transform:translateY(102%);transition:transform .26s cubic-bezier(.2,.8,.2,1)}
.layer.open .panel{transform:none}
@media (min-width:900px){
  .panel{left:auto;top:0;width:min(1020px,calc(100vw - var(--rail) - 40px));border-radius:18px 0 0 18px;transform:translateX(102%)}
}
.panel-h{display:flex;align-items:center;gap:8px;padding:10px 12px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--surface);border-radius:18px 18px 0 0}
@media (min-width:900px){ .panel-h{border-radius:18px 0 0 0;padding-top:max(10px,env(safe-area-inset-top,0px))} }
.panel-h .crumb{flex:1;min-width:0;font-weight:800;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.panel-h .crumb small{display:block;font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--ink-3)}
.grab{position:absolute;top:6px;left:50%;width:40px;height:4px;margin-left:-20px;border-radius:9px;background:var(--line)}
@media (min-width:900px){ .grab{display:none} }
.panel-b{flex:1;overflow:auto;padding:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(28px + env(safe-area-inset-bottom,0px));overscroll-behavior:contain}

.kd{display:grid;gap:16px}
@media (min-width:900px){ .kd{grid-template-columns:minmax(260px,330px) minmax(0,1fr);align-items:start} .kd-page{position:sticky;top:0} }
.kd-page{display:flex;flex-direction:column;gap:8px}
.pagebtn{position:relative;display:block;width:100%;padding:0;border:0;background:var(--paper);border-radius:8px;overflow:hidden;box-shadow:0 0 0 1px var(--line),var(--shadow)}
.pagebtn img{display:block;width:100%;aspect-ratio:595.3/841.9;object-fit:cover}
.pagebtn .ov{position:absolute;left:8px;right:8px;bottom:8px;display:flex;align-items:center;justify-content:center;gap:7px;padding:9px;border-radius:10px;background:rgba(10,20,15,.82);color:#fff;font-weight:700;font-size:14px}
.pagebtn .ov svg{width:18px;height:18px}
@media (max-width:899px){ .pagebtn img{aspect-ratio:595.3/560;object-position:top} }
.kd-noimg{padding:18px;border:1.5px dashed var(--line);border-radius:10px;text-align:center;color:var(--ink-3);font-size:13.5px}
.kd-info{display:flex;flex-direction:column;gap:14px;min-width:0}
.kd-title{display:flex;flex-direction:column;gap:6px}
.kd-title .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.kd-title .code{font-family:var(--f-mono);font-weight:700;font-size:26px;letter-spacing:-.02em;line-height:1.05}
.kd-title p{margin:0;color:var(--ink-2);font-size:14.5px}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.kv div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 11px;min-width:0}
.kv dt{font-size:11.5px;font-weight:700;color:var(--ink-3);letter-spacing:.04em;text-transform:uppercase}
.kv dd{margin:2px 0 0;font-size:14px;font-weight:600;overflow-wrap:anywhere}
.addbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.addbar .field{width:110px}
.comp{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.comp-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px 14px;border-bottom:1px solid var(--line)}
.comp-h h3{font-size:14.5px}
.crow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:3px 11px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.crow:last-child{border-bottom:0}
.crow:hover{background:var(--surface-2)}
.crow .c{font-family:var(--f-mono);font-weight:700;font-size:14.5px}
.crow .a{grid-column:2;font-size:13px;color:var(--ink-2);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.crow .q{grid-row:span 2;font-size:18px;font-weight:800;font-variant-numeric:tabular-nums;text-align:right}
.crow .q small{font-family:var(--f-body);font-size:11px;color:var(--ink-3);font-weight:600;display:block}
.crow .callout{grid-row:span 2}
.crow .go{border:0;background:none;color:var(--ink-3);display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:2px 4px;border-radius:6px}
.crow .go:hover{color:var(--accent);background:var(--accent-soft)}
.crow .go svg{width:14px;height:14px}
.dl{display:grid;gap:8px}
.dl div{display:grid;grid-template-columns:108px minmax(0,1fr);gap:10px;font-size:14px}
.dl dt{font-weight:700;color:var(--ink-3);font-size:12px;letter-spacing:.05em;text-transform:uppercase;padding-top:2px}
.dl dd{margin:0}
.rev-box{border-radius:var(--r);border:1px solid var(--line);background:var(--surface);padding:14px;display:flex;flex-direction:column;gap:10px}
.rev-box.attn{border-color:var(--warn);box-shadow:inset 3px 0 0 var(--warn)}
.rev-box ul{margin:0;padding-left:18px;font-size:13.5px;color:var(--ink-2)}
.cmp{width:100%;border-collapse:collapse;font-size:13.5px}
.cmp th{text-align:left;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);padding:6px 8px;border-bottom:1px solid var(--line)}
.cmp td{padding:6px 8px;border-bottom:1px solid var(--line)}
.cmp td.n,.cmp th.n{text-align:right;font-variant-numeric:tabular-nums}
.cmp tr.add td{background:var(--ok-soft)} .cmp tr.rem td{background:var(--crit-soft)} .cmp tr.chg td{background:var(--warn-soft)}
.tablewrap{overflow-x:auto}
.edit-row{display:grid;grid-template-columns:minmax(0,1.2fr) 74px minmax(0,1.4fr) 34px;gap:6px;margin-bottom:6px}
.edit-row .field{min-height:38px;padding:6px 9px;font-size:14px}
.where{display:flex;flex-direction:column;gap:8px}
.wrow{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:11px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer}
.wrow:hover{border-color:var(--ink-3)}
.wrow .page-thumb,.wrow .noimg{width:48px}
.wrow .noimg{aspect-ratio:595.3/841.9;border-radius:4px;border:1.5px dashed var(--line)}
.wrow .c{font-family:var(--f-mono);font-weight:700}
.wrow .d{font-size:12.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wrow .q{text-align:right;font-weight:800;font-size:17px}
.wrow .q small{display:block;font-family:var(--f-body);font-size:11px;color:var(--ink-3)}
.part-hero{display:flex;flex-direction:column;gap:8px}
.part-hero .code{font-family:var(--f-mono);font-weight:700;font-size:28px;line-height:1.1}
.form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.form-grid label{font-size:12px;font-weight:700;color:var(--ink-3);display:flex;flex-direction:column;gap:4px}

/* notifications */
.ev{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;text-align:left;width:100%}
.ev.unread{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.ev img{width:34px;height:34px;border-radius:50%}
.ev p{margin:0;font-size:14px}
.ev small{color:var(--ink-3);font-size:12px}
.pend{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px;border-radius:10px;background:var(--surface);border:1px solid var(--line);text-align:left;width:100%}
.pend .v{font-weight:800;font-size:22px;line-height:1;color:var(--accent-ink)}
.pend svg{width:18px;height:18px;color:var(--ink-3)}
/* ---------- catalog viewer ---------- */
.viewer{position:fixed;inset:0;z-index:70;background:var(--viewer-bg);display:none;flex-direction:column;color:#EEF3F0}
.viewer.open{display:flex}
.v-top{display:flex;align-items:center;gap:8px;padding:8px 10px;padding-top:max(8px,env(safe-area-inset-top,0px));padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));background:rgba(255,255,255,.04);border-bottom:1px solid rgba(255,255,255,.08)}
.v-top .t{flex:1;min-width:0}
.v-top .t b{display:block;font-family:var(--f-mono);font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v-top .t span{font-size:12px;opacity:.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.vbtn{width:40px;height:40px;border-radius:10px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:#EEF3F0;display:grid;place-items:center;flex-shrink:0}
.vbtn:hover{background:rgba(255,255,255,.14)}
.vbtn svg{width:19px;height:19px}
.vbtn[disabled]{opacity:.3}
.v-zoom{display:none;gap:6px}
@media (min-width:640px){ .v-zoom{display:flex} }
.v-stage{flex:1;overflow:auto;position:relative;touch-action:pan-x pan-y;-webkit-overflow-scrolling:touch}
.v-page{position:relative;margin:12px auto;background:#fff;box-shadow:0 10px 40px rgba(0,0,0,.5);transform-origin:top left}
.v-page img{display:block;width:100%;height:auto;aspect-ratio:595.3/841.9;user-select:none;-webkit-user-drag:none}
.v-load{position:absolute;inset:0;display:grid;place-items:center;color:#8a9;font-size:14px}
.hot{position:absolute;border:0;padding:0;background:transparent;border-radius:3px;cursor:pointer}
.hot:hover,.hot:focus-visible{background:rgba(14,107,69,.12);box-shadow:0 0 0 2px rgba(14,107,69,.85)}
.hot.on{background:rgba(255,190,40,.22);box-shadow:0 0 0 2.5px #E89B00}
.hot.ph.on{background:rgba(255,190,40,.12)}
@media (prefers-reduced-motion:no-preference){ .hot.on{animation:pulse 1.6s ease-out 2} }
@keyframes pulse{0%{box-shadow:0 0 0 2.5px #E89B00,0 0 0 0 rgba(232,155,0,.55)}100%{box-shadow:0 0 0 2.5px #E89B00,0 0 0 14px rgba(232,155,0,0)}}
.v-items{display:flex;gap:6px;overflow-x:auto;padding:8px 10px;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));border-top:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03)}
.v-items button{flex-shrink:0;display:inline-flex;gap:6px;align-items:center;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);color:#EEF3F0;border-radius:999px;padding:6px 11px;font-family:var(--f-mono);font-size:12.5px}
.v-items button[aria-pressed="true"]{background:#E89B00;border-color:#E89B00;color:#14100A}
.v-items b{font-family:var(--f-body);opacity:.7;font-size:11px}
.v-pop{position:absolute;left:50%;bottom:calc(64px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(440px,calc(100vw - 24px));background:var(--surface);color:var(--ink);border-radius:14px;box-shadow:0 10px 40px rgba(0,0,0,.5);padding:13px 14px;display:flex;flex-direction:column;gap:8px;z-index:3}
.v-pop .h{display:flex;align-items:center;gap:9px}
.v-pop .h b{font-family:var(--f-mono);font-size:17px}
.v-pop .meta{display:flex;gap:6px;flex-wrap:wrap;font-size:13px;color:var(--ink-2)}
.v-pop .acts{display:flex;gap:6px;flex-wrap:wrap}
.v-bottom{position:relative}

/* toast */
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tab) + 14px + env(safe-area-inset-bottom,0px));z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;width:min(460px,calc(100vw - 32px));pointer-events:none}
@media (min-width:900px){ .toasts{bottom:24px;left:calc(50% + var(--rail)/2)} }
.toast{pointer-events:auto;background:var(--ink);color:var(--surface);padding:11px 15px;border-radius:12px;font-size:14px;box-shadow:var(--shadow-lg);display:flex;gap:10px;align-items:center}
.toast button{border:0;background:none;color:inherit;font-weight:700;text-decoration:underline}
@media (prefers-reduced-motion:no-preference){ .toast{animation:tin .2s ease-out} @keyframes tin{from{opacity:0;transform:translateY(6px)}} }
@media (prefers-reduced-motion:reduce){ .panel,.layer .scrim{transition:none} }
.loading{display:grid;place-items:center;min-height:50vh;color:var(--ink-2);font-weight:700;font-size:15px}

/* ================= cadastro (novo) ================= */
textarea.field{min-height:84px;resize:vertical;line-height:1.4;font:inherit;color:inherit}
.demo-strip svg{width:18px;height:18px;flex-shrink:0;color:var(--violet)}
.drop{flex-wrap:wrap}
.drop p{min-width:170px}
.rail .tab .badge{position:static;margin-left:auto;border:0}
select.field{appearance:auto}
.lbl{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:700;color:var(--ink-2);min-width:0}
.lbl .hint{font-weight:500;color:var(--ink-3);font-size:11.5px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px 12px}
.fgrid .wide{grid-column:1/-1}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sec-h h3{font-size:15px}
.sec-h .meta{font-size:12.5px;color:var(--ink-3);font-weight:600}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.sticky-actions{position:sticky;bottom:calc(-28px - env(safe-area-inset-bottom,0px));margin:0 -16px -28px;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;z-index:5}
.sticky-actions .btn{flex:1 1 auto}
@media (min-width:640px){ .sticky-actions .btn{flex:0 0 auto} }
.errbox{background:var(--crit-soft);color:var(--crit);border-radius:10px;padding:10px 12px;font-size:13.5px;font-weight:600}

/* itens do editor */
.irow{display:grid;gap:6px;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--surface);
  grid-template-columns:66px 86px minmax(0,1fr) 40px;grid-template-areas:"n q . x" "c c c c" "a a a a" "m m m m" "p p p p" "h h h h"}
.irow .f-n{grid-area:n}.irow .f-c{grid-area:c}.irow .f-q{grid-area:q}.irow .f-a{grid-area:a}.irow .f-x{grid-area:x}.irow .f-h{grid-area:h}
/* foto do item (= foto da peça) */
.irow .f-p{grid-area:p;display:flex;gap:10px;align-items:center;min-width:0;padding-top:2px}
.ph-tile{width:68px;height:68px;flex:none;border-radius:10px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;overflow:hidden;padding:3px;cursor:pointer;color:var(--ink-3)}
.ph-tile img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.ph-tile svg{width:22px;height:22px}
.ph-tile.vazio{border-style:dashed;background:var(--surface-2)}
.ph-tile.nova{border:2px solid var(--violet);box-shadow:0 0 0 3px color-mix(in srgb,var(--violet) 18%,transparent)}
span.ph-tile{cursor:default}
.ph-txt{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}
.ph-txt .row{gap:6px}
.ph-st{font-size:12.5px;color:var(--ink-2)}
.ph-st .new{color:var(--violet)}
/* Ctrl+V: onde a imagem vai cair */
.irow.alvo{border-color:var(--accent,#22A559);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent,#22A559) 35%,transparent)}
#edEtq.alvo .etq-box,#edFotos.alvo{outline:2px solid var(--accent,#22A559);outline-offset:3px;border-radius:12px}
@media (hover:hover){ .irow.alvo .ph-st::after{content:'  ·  Ctrl+V cola a foto aqui';color:var(--ink-3);font-weight:600} }
.irow .f-m{grid-area:m;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.irow .field{min-height:40px;padding:7px 9px;font-size:14px}
.irow .f-n .field,.irow .f-q .field{text-align:center;font-family:var(--f-mono);font-weight:700}
.irow .f-c .field{font-family:var(--f-mono);font-weight:700}
.irow.pend{border-color:var(--warn);box-shadow:inset 3px 0 0 var(--warn)}
.irow.bad{border-color:var(--crit);box-shadow:inset 3px 0 0 var(--crit)}
.irow .mini{font-size:10.5px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.04em;display:block;margin:0 0 2px 2px}
.chint{font-size:12px;color:var(--ink-2);display:flex;gap:6px;align-items:center;flex-wrap:wrap;min-height:18px}
.chint .new{color:var(--violet);font-weight:700}
.chint .ok{color:var(--ok);font-weight:700}
.chint img{width:26px;height:26px;object-fit:contain;border-radius:5px;background:#fff;border:1px solid var(--line)}
@media (max-width:520px){ .irow .f-m{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (min-width:1100px){
  .irow{grid-template-columns:60px minmax(170px,1fr) 78px minmax(0,1.7fr) 40px;grid-template-areas:"n c q a x" "m m m m m" "p p p p p" "h h h h h";align-items:end}
  .irow .f-p{align-self:center}
  .irow .f-m{grid-template-columns:90px minmax(0,1fr) minmax(0,1fr) minmax(0,1.6fr)}
}
.ilist{display:flex;flex-direction:column;gap:8px}

/* fotos */
.ftiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ftile{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden;display:flex;flex-direction:column}
.ftile .im{aspect-ratio:4/3;background:#fff;display:grid;place-items:center;border-bottom:1px solid var(--line)}
.ftile .im img{max-width:100%;max-height:100%;object-fit:contain}
.ftile .fb{padding:8px;display:flex;flex-direction:column;gap:6px}
.ftile .fb .field{min-height:36px;padding:6px 8px;font-size:13px}
.addphoto{border:1.5px dashed var(--line);border-radius:12px;display:grid;place-items:center;gap:6px;min-height:150px;background:var(--surface-2);color:var(--ink-2);font-weight:700;font-size:13px;text-align:center;padding:10px}
.addphoto:hover{border-color:var(--accent);color:var(--accent-ink);background:var(--accent-soft)}
.addphoto svg{width:26px;height:26px}

/* listas */

/* ================= ficha no estilo do catálogo ================= */

.fz-grp{display:grid;gap:3px;width:100%;justify-items:center;align-items:center}   /* foto repetida pela qtde */
.fz-x{font-size:11px;font-weight:700;margin-top:2px}
/* fotos em posição livre (Ajustar fotos): cada casa tem lugar e tamanho próprios, presa dentro da área */
.fz-photos.livre{display:block;position:relative;padding:0}
.fz-area{position:absolute;left:8px;right:8px;top:10px;bottom:10px;overflow:hidden}

.fz-photos.livre .fz-grp img{max-width:100%;max-height:100%;object-fit:contain;min-height:0}

.ficha.editando,.ficha.editando *{user-select:none;-webkit-user-select:none}
body.arrastando,body.arrastando *{user-select:none!important;-webkit-user-select:none!important;cursor:grabbing}

.ficha.editando .fz-area{outline:1.5px solid #22a559;touch-action:none}

.ficha.editando .fz-ph.ativo{outline:2px solid #22a559;background:rgba(34,165,89,.10);z-index:2}

.ficha.editando .gr-badge{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(17,17,17,.75);color:#fff;font-size:13px;font-weight:700;padding:3px 8px;border-radius:8px;pointer-events:none;z-index:4}

.ficha.editando .rs{position:absolute;right:0;bottom:0;width:22px;height:22px;cursor:nwse-resize;touch-action:none;
  background:linear-gradient(135deg,transparent 0 50%,#22a559 50% 100%);border-bottom-right-radius:2px}
#printArea .ficha.editando .fz-ph{outline:0;background:none}
/* peça repetida: cada foto pode ser pega sozinha; o grupo anda pela faixa do número */
.fz-photos.livre .fz-grp .gc{position:relative}

.ficha.editando .fz-ph.grp.solto > .n,.ficha.editando .fz-ph.grp.solto .gc,.ficha.editando .fz-ph.grp.solto > .rs,.ficha.editando .fz-ph.grp.solto > .rt,.ficha.editando .fz-ph.grp.solto > .rg{pointer-events:auto}
.ficha.editando .fz-grp .gc .rs,.ficha.editando .fz-grp .gc .rt{display:none}
.ficha.editando .fz-grp .gc.ativo{outline:2px solid #2563eb;outline-offset:-2px;background:rgba(37,99,235,.08);z-index:3}
.ficha.editando .fz-grp .gc.ativo .rt{display:grid;width:20px;height:20px;right:1px;top:1px;font-size:13px;background:#2563eb;z-index:4}
.ficha.editando .fz-grp .gc.ativo .rs{display:block;width:16px;height:16px;z-index:4;background:linear-gradient(135deg,transparent 0 50%,#2563eb 50% 100%)}
.ficha.editando .fz-ph.copia-ativa > .rs,.ficha.editando .fz-ph.copia-ativa > .rt{display:none}
.ficha.editando .rg{position:absolute;left:2px;top:1px;width:18px;height:18px;border-radius:5px;background:#fff;border:1.5px solid #22a559;color:#1d6d35;display:grid;place-items:center;font-size:12px;line-height:1;cursor:pointer;z-index:5}
#printArea .ficha.editando .rg{display:none}
/* ficha ampliada (conferir o PDF com zoom) */
.ficha-wrap.zoomavel{cursor:zoom-in}
.fzv .fzv-zoom{display:flex;gap:6px;align-items:center}
.fzv-pct{min-width:60px;height:40px;border-radius:10px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:#EEF3F0;font-weight:700;font-size:13px;font-variant-numeric:tabular-nums;cursor:pointer}
.fzv-pct:hover{background:rgba(255,255,255,.14)}

.fzv-stage.pan{cursor:grabbing;user-select:none;-webkit-user-select:none}

.fzv-page .ficha{pointer-events:none}
.fzv-page .fz-ph.empty{visibility:hidden}
@media (max-width:639px){ .fzv .v-top .t span{display:none} .fzv .fzv-zoom .vbtn[data-z="largura"]{display:none} }
/* baixar catálogo */
.chkrow{display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer}
.chkrow input{width:20px;height:20px;accent-color:var(--brand,#22a559);flex:none}
.chkrow .c{flex:1;font-weight:700}
.chkrow.off{opacity:.5;cursor:default}
.fz-ph.empty .box{width:100%;aspect-ratio:4/3;border:1.5px dashed #bbb;border-radius:6px;display:grid;place-items:center;color:#999;font-size:11px;text-align:center;padding:4px;background:#fafafa}
.fz-ph.empty button.box{cursor:pointer;font:inherit;font-size:11px;font-weight:700;color:#1d6d35;border-color:#9bd3ae;background:#f2fbf5}
.fz-right{display:flex;flex-direction:column;min-width:0}

.fz-tab td.q{text-align:center}
.fz-tab td:nth-child(2),.fz-tab td:nth-child(3),.fz-tab td:nth-child(5){text-align:center}   /* como no catálogo */
.fz-tab tr.it{cursor:pointer}
.fz-tab tr.it:hover td{background:#fff6d6}

.fz-tab col.c1{width:33%} .fz-tab col.c2{width:7%} .fz-tab col.c3{width:19%} .fz-tab col.c4{width:7%} .fz-tab col.c5{width:34%}
.fz-blk{border-top:1px solid #222;padding:5px 7px;font-size:10.5px;min-height:46px}

.fz-code .q{font-weight:900;font-size:15px}
.fz-foot{display:grid;grid-template-columns:1fr auto 1fr;font-size:11px;padding:6px 2px 0;align-items:center}
.fz-foot .l{font-weight:700}
.fz-foot .r{text-align:right;font-weight:700}
.fz-etq{margin:auto 8px 6px;display:flex;justify-content:center;align-items:flex-end}
.fz-etq img{max-width:100%;max-height:300px;object-fit:contain;display:block}
.etq-box{display:flex;flex-direction:column;gap:8px;padding:10px;border:1.5px dashed var(--line);border-radius:12px;background:var(--surface-2)}

.fz-wm span{transform:rotate(-30deg);font-size:112px;font-weight:900;color:rgba(214,20,20,.9);letter-spacing:6px;white-space:nowrap;line-height:1.15;padding:0 26px;border:11px solid rgba(214,20,20,.9);border-radius:18px;-webkit-text-stroke:2px rgba(214,20,20,.9)}

.ficha-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.kd2{display:grid;gap:16px}

.mini-ref .page-thumb{width:60px}

/* pendências / avisos */
.pd-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:11px 14px;border:0;border-bottom:1px solid var(--line);background:none;width:100%;text-align:left}
.pd-row:last-child{border-bottom:0}
.pd-row:hover{background:var(--surface-2)}
.pd-row .c{font-family:var(--f-mono);font-weight:700;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pd-row .d{font-size:13px;color:var(--ink-2);grid-column:1/-1}
.av-row{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:10px;align-items:start;padding:11px 14px;border:0;border-bottom:1px solid var(--line);background:none;width:100%;text-align:left}

.av-row span{font-size:12.5px;color:var(--ink-2)}
.av-row small{font-size:12px;color:var(--ink-3);white-space:nowrap}

.hist div{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.hist small{color:var(--ink-3);white-space:nowrap}

/* impressão: só as fichas / a lista da calculadora */
#printArea{display:none}
@media print{
  @page{size:A4;margin:0}
  html,body{background:#fff!important;height:auto}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block}
  #printArea .ficha{transform:none!important;page-break-after:always;break-after:page}

  #printArea .plist-print{padding:12mm;font-family:Arial,Helvetica,sans-serif;color:#111}
  #printArea .plist-print table{width:100%;border-collapse:collapse;font-size:10.5pt}

  #printArea .plist-print td.n{text-align:right}
  #printArea .plist-print h2{font-size:14pt;margin:10px 0 4px}
}

/* ================= fotos: reduz no navegador antes de enviar ================= */
function loadImgEl(src){ return new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = src; }); }
async function resizeImage(file, max, quality){
  const url = URL.createObjectURL(file);
  try {
    const im = await loadImgEl(url);
    const s = Math.min(1, max / Math.max(im.naturalWidth, im.naturalHeight));
    const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(im.naturalWidth * s)); c.height = Math.max(1, Math.round(im.naturalHeight * s));
    const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(im, 0, 0, c.width, c.height);
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', quality));
    return { blob, w:c.width, h:c.height };
  } finally { URL.revokeObjectURL(url); }
}
const refImgs = new Map();
function loadRefImg(url){   // imagens do catálogo (páginas sNNN e folhas de fotos fNN), com CORS para poder recortar
  if (!refImgs.has(url)) refImgs.set(url, new Promise((res, rej) => { const im = new Image(); im.crossOrigin = 'anonymous';
    im.onload = () => res(im); im.onerror = () => { refImgs.delete(url); rej(Object.assign(new Error('Não consegui abrir a imagem do catálogo para recortar (na prévia do Claude isso pode acontecer; na página publicada as fotos vêm prontas do Storage).'), { friendly:true })); }; im.src = url; }));
  return refImgs.get(url);
}
function cropToBlob(im, sx, sy, sw, sh, q){
  const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(sw)); c.height = Math.max(1, Math.round(sh));
  const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(im, sx, sy, sw, sh, 0, 0, c.width, c.height);
  return new Promise(res => c.toBlob(res, 'image/jpeg', q || 0.92));
}
async function cropRefBox(pdfPage, b, pad){   // recorta um retângulo (em pontos do PDF) da página do catálogo
  const m = REF.pm.map[String(pdfPage)]; if (!m) throw Object.assign(new Error('Essa página do catálogo não está nas imagens.'), { friendly:true });
  const im = await loadRefImg(CONFIG.refImgBase + 's' + String(m[0]).padStart(3, '0') + '.webp');
  const per = REF.pm.per || 3, H = im.naturalHeight / per, sc = im.naturalWidth / (REF.pm.pageW || 595.276);
  const [x0, y0, x1, y1] = b; pad = pad == null ? 2 : pad;
  return cropToBlob(im, Math.max(0, (x0 - pad) * sc), m[1] * H + Math.max(0, (y0 - pad) * sc), (x1 - x0 + 2 * pad) * sc, (y1 - y0 + 2 * pad) * sc);
}
async function cropRefLabel(r){
  if (!r || !r.lb || !REF.pm.map[String(r.p)]) throw Object.assign(new Error('Essa página do catálogo não tem etiqueta.'), { friendly:true });
  return cropRefBox(r.p, r.lb, 2);
}
/* fotos e etiquetas do catálogo
   - Supabase: arquivos prontos no Storage (catalogo/referencia/fotos/<peça>.webp e referencia/etiquetas/pNNN.webp).
     O app só aponta para eles: não recorta nada no navegador (sem canvas, sem CORS).
   - Demonstração: recorta das folhas fNN.webp / páginas sNNN.webp que vêm junto da prévia. */
const refFotoOf = cod => (REF.fp && cod && REF.fp[chave(cod)]) || null;
const refFotoKey = cod => chave(cod).replace(/[^A-Z0-9]/g, '_');
const refFotoPath = cod => refFotoOf(cod) ? 'referencia/fotos/' + refFotoKey(cod) + '.webp' : null;
const refEtqPath = r => (r && r.lb && r.p) ? 'referencia/etiquetas/p' + String(r.p).padStart(3, '0') + '.webp' : null;
const refFotoPossivel = (cod, r, item) => !!(cod && (refFotoOf(cod) || (S.mode === 'demo' && r && r.ph && r.ph[item])));
const imgChecks = new Map();
function imgOk(url){   // a imagem existe? (só carrega, sem CORS)
  if (!imgChecks.has(url)) imgChecks.set(url, new Promise(res => { const im = new Image(); const t = setTimeout(() => res(false), 9000);
    im.onload = () => { clearTimeout(t); res(true); }; im.onerror = () => { clearTimeout(t); res(false); }; im.src = url; }));
  return imgChecks.get(url).then(ok => { if (!ok) imgChecks.delete(url); return ok; });
}
const semArquivo = (oque, pasta) => Object.assign(new Error(oque + ' ainda não está no Storage (referencia/' + pasta + '). Suba as imagens em Configuração › Imagens do catálogo.'), { friendly:true });
async function refFoto(cod, r, item){   // → { path } no Supabase, { blob } na demonstração, null se o catálogo não tem foto dessa peça
  if (S.mode !== 'demo'){
    const path = refFotoPath(cod); if (!path) return null;
    if (!(await imgOk(fotoUrl(path)))) throw semArquivo('A foto do catálogo', 'fotos');
    return { path };
  }
  const e = refFotoOf(cod);
  if (e){ try { const im = await loadRefImg(CONFIG.refImgBase + 'f' + String(e[0]).padStart(2, '0') + '.webp'); return { blob:await cropToBlob(im, e[1], e[2], e[3], e[4], 0.9) }; } catch(err){} }
  const b = r && r.ph && r.ph[item];
  return b ? { blob:await cropRefBox(r.p, b, 1) } : null;
}
async function refEtiqueta(r){   // → caminho da imagem da etiqueta
  if (!r || !r.lb) throw Object.assign(new Error('Essa página do catálogo não tem etiqueta.'), { friendly:true });

  }
  return DB.upload(await cropRefLabel(r), 'kits/' + slug(r.k) + '/etiqueta-' + Date.now() + '.jpg');
}

  const pecaOf = id => d.pecas.find(p => p.id === id);
  const kitOf = id => d.kits.find(k => k.id === id);
  const pecaByCode = cod => d.pecas.find(p => p.chave === chave(cod));
  function newPeca(o){

      familia:d.familias.some(f => f.nome === o.familia) ? o.familia : null, predio:d.predios.some(f => f.nome === o.predio) ? o.predio : null,

      const walk = (pid, q, path, kc) => {
        const cs = by.get(pid);
        if (cs && cs.length && path.length < 10){ cs.forEach(c => { if (!path.includes(c.componente_id)) walk(c.componente_id, q * c.qtde, path.concat(c.componente_id), kc); }); return; }

/* ================= banco: Supabase ================= */
function SupaStore(){
  const sb = window.supabase.createClient(CONFIG.supabaseUrl, CONFIG.supabaseKey, { auth:{ persistSession:true, autoRefreshToken:true, storageKey:'ju-calc-auth' } });
  const friendly = e => {
    const m = (e && (e.message || e.error_description || e.msg)) || String(e);
    if (/row-level security|permission denied/i.test(m)) return 'Sem permissão para isso (peça para um admin liberar o papel de editor).';
    if (/duplicate key.*kits_codigo_unico/i.test(m)) return 'Já existe um kit com esse código para esse cliente.';
    if (/duplicate key.*pecas_chave_unica/i.test(m)) return 'Já existe uma peça com esse código.';
    if (/violates foreign key.*kit_itens|still referenced/i.test(m)) return 'Esse registro está em uso e não pode ser apagado.';
    if (/Failed to fetch|NetworkError|Load failed/i.test(m)) return 'Sem conexão com o banco. Confira a internet e tente de novo.';
    if (/Invalid login credentials/i.test(m)) return 'E-mail ou senha incorretos.';
    if (/Email not confirmed/i.test(m)) return 'Esse e-mail ainda não foi confirmado.';
    return m;
  };
  const q = async p => { const { data, error } = await p; if (error){ const e = new Error(friendly(error)); e.friendly = true; e.raw = error; throw e; } return data; };
  async function fetchAll(table, select, order){
    let out = [], from = 0;
    for (;;){ const rows = await q(sb.from(table).select(select).order(order).range(from, from + 999)); out = out.concat(rows); if (rows.length < 1000) break; from += 1000; }
    return out;
  }
  const who = () => (S.me && S.me.nome) || null;
  const PECA_COLS = 'id,codigo,chave,descricao,tipo,familia,predio,fornecedor,espessura,material,unidade,foto_path,obs,ativo';
  const api = {
    sb,
    async session(){ const { data } = await sb.auth.getSession(); return data.session; },
    async publicConfig(){ try { const r = await q(sb.from('config').select('*').limit(1)); return r[0] || {}; } catch(e){ return { __erro:e.message }; } },
    async signIn(email, password){ await q(sb.auth.signInWithPassword({ email, password })); },
    async signOut(){ await sb.auth.signOut(); },
    async resetPassword(email){ await q(sb.auth.resetPasswordForEmail(email, { redirectTo:location.href.split('#')[0] })); },
    async updatePassword(password){ await q(sb.auth.updateUser({ password })); },
    onAuth(cb){ sb.auth.onAuthStateChange((ev, session) => cb(ev, session)); },
    async init(){
      const ses = await api.session();
      const [cfg, clientes, predios, familias] = await Promise.all([

function histResumo(h){
  const a = h.antes || {}, n = h.depois || {};
  if (h.acao === 'INSERT') return { kits:'Kit cadastrado', kit_itens:'Item ' + (n.item || '') + ' incluído', kit_fotos:'Foto incluída', pecas:'Peça cadastrada', peca_componentes:'Peça incluída no sub-kit' }[h.tabela] || 'Incluído';
  if (h.acao === 'DELETE') return { kits:'Kit apagado', kit_itens:'Item ' + (a.item || '') + ' retirado', kit_fotos:'Foto retirada', pecas:'Peça apagada', peca_componentes:'Peça retirada do sub-kit' }[h.tabela] || 'Apagado';
  const ch = Object.keys(n).filter(k => JSON.stringify(n[k]) !== JSON.stringify(a[k]));
  const LBL = { status:'status', descricao:'descrição', qtde:'qtde', peca_id:'peça', aplicacao:'aplicação', embalagem:'embalagem', observacao:'observação', etiqueta:'etiqueta', foto_path:'foto', layout_fotos:'posição das fotos', predio:'prédio', familia:'família', codigo:'código', revisao:'revisão', itens:'itens da foto', pendencia:'pendência' };
  if (ch.includes('status')) return 'Status: ' + ((STATUS[a.status] || {}).l || a.status) + ' → ' + ((STATUS[n.status] || {}).l || n.status) + (n.status === 'aprovado' ? ' (revisão ' + n.revisao + ')' : '');
  const pre = h.tabela === 'kit_itens' ? 'Item ' + (n.item || a.item) + ': ' : '';
  return pre + (ch.filter(k => k !== 'revisao' && k !== 'aprovado_em' && k !== 'aprovado_por').map(k => LBL[k] || k).join(', ') || 'alterado');
}

const DUVIDA_ST = { corrigido:'catálogo diferente da planilha antiga', novo_incompleto:'catálogo com lacunas', sem_composicao:'página sem itens', estrutura_kb:'sub-kit detalhado na planilha antiga', base_mantida:'catálogo incompleto' };

  const list = REF.kits.filter(r => {
    const has = cov.have.has(kitKey(r.k));
    if (F.f === 'faltam' && has) return false; if (F.f === 'feitos' && !has) return false; if (F.f === 'duvida' && !DUVIDA_ST[r.s]) return false;
    return !q || norm(r.k + ' ' + r.d + ' ' + r.u + ' ' + (r.a || []).join(' ')).includes(q) || kitKey(r.k) === kitKey(F.q);

/* ================= ficha no estilo do catálogo ================= */
const itemNum = s => { const m = String(s || '').match(/\d+/); return m ? Number(m[0]) : 9999; };
/* quantidade grande: a ficha repete a foto (uma peça) e agrupa, como o catálogo faz com anéis e arruelas */
const AGRUPAR_A_PARTIR = 2;       // qtde a partir da qual a foto do item aparece repetida (como no catálogo)
const AGRUPAR_MAX = 30;           // acima disso mostra 30 e escreve "× qtde"
const REF_FG = new Set(REF.fg || []);   // fotos do catálogo que já mostram várias peças juntas: não repete
function repeticoes(codigo, path, qtde){
  const q = Number(qtde);
  if (!path || !Number.isInteger(q) || q < AGRUPAR_A_PARTIR) return 1;
  if (REF_FG.has(chave(codigo)) && (S.mode === 'demo' || /^referencia\//.test(path))) return 1;
  return q;
}
function fichaCells(data, edit){
  const cells = [], covered = new Set();
  data.fotos.forEach((f, n) => { const its = (f.itens || []).filter(Boolean); cells.push({ key:'f' + (f.id || 'n' + n), label:its.join(' '), src:fotoUrl(f.caminho), first:its.length ? Math.min(...its.map(itemNum)) : 9998 }); its.forEach(i => covered.add(i)); });
  data.itens.forEach(i => {
    if (covered.has(i.item)) return;
    if (i.peca && i.peca.foto_path) cells.push({ key:i.item, label:i.item, src:fotoUrl(i.peca.foto_path), first:itemNum(i.item), n:repeticoes(i.peca.codigo, i.peca.foto_path, i.qtde) });
    else if (edit) cells.push({ key:i.item, label:i.item, empty:true, peca:i.peca, first:itemNum(i.item) });
  });
  return cells.sort((a, b) => a.first - b.first);
}
/* posição livre das fotos (Ajustar fotos): {chave:[x, y, largura, altura]} em fração da área das fotos */
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
function posClamp(p){ const w = clamp(+p[2] || .3, .05, 1), h = clamp(+p[3] || .12, .03, 1), g = ((Math.round(+p[4] || 0) % 360) + 360) % 360;
  const o = [clamp(+p[0] || 0, 0, 1 - w), clamp(+p[1] || 0, 0, 1 - h), w, h]; if (g) o.push(g); return o; }
/* foto girada: o tamanho é recalculado para a foto girada caber inteira na casa dela (não sai do espaço).
   Peça repetida: cada cópia pode ter o seu giro (data-rot na .gc), somado ao giro do grupo */
function girarFotos(root){
  new Set($$('[data-rot]', root).map(x => x.closest('.fz-ph')).filter(Boolean)).forEach(c => {
    const g0 = Number(c.dataset.rot) || 0;
    $$('img', c).forEach(im => {
      const gcEl = im.closest('.gc'), g = (g0 + (gcEl ? Number(gcEl.dataset.rot) || 0 : 0)) % 360;
      const par = im.parentElement, pw = par.clientWidth, ph = par.clientHeight, a = (im.naturalWidth || 1) / (im.naturalHeight || 1);
      if (!pw || !ph) return;
      if (!g){ Object.assign(im.style, { width:'', height:'', maxWidth:'', maxHeight:'', flex:'', transform:'' }); return; }
      const r = g * Math.PI / 180, cs = Math.abs(Math.cos(r)), sn = Math.abs(Math.sin(r));
      const ih = Math.max(4, Math.min(pw / (a * cs + sn), ph / (a * sn + cs))), iw = a * ih;
      Object.assign(im.style, { width:iw.toFixed(1) + 'px', height:ih.toFixed(1) + 'px', maxWidth:'none', maxHeight:'none', flex:'none', transform:'rotate(' + g + 'deg)' });
    });
  });
}
/* peça repetida solta (Ajustar fotos): cada cópia tem lugar próprio, salvo como "01~2": [x, y, largura, altura, graus]
   em fração do espaço das fotos do grupo. Sem "~1" o grupo fica em grade. */
const gradeDe = n => { const gc = n <= 3 ? n : Math.min(10, Math.ceil(n / 2)); return [gc, Math.ceil(n / gc)]; };
function copiaGrade(i, n){ const [gc, gr] = gradeDe(n); return [((i - 1) % gc) / gc, Math.floor((i - 1) / gc) / gr, 1 / gc, 1 / gr]; }
function copiaClamp(p){ const w = clamp(+p[2] || .1, .01, 1), h = clamp(+p[3] || .1, .01, 1), g = ((Math.round(+p[4] || 0) % 360) + 360) % 360;
  const o = [clamp(+p[0] || 0, 0, 1 - w), clamp(+p[1] || 0, 0, 1 - h), w, h]; if (g) o.push(g); return o; }
const grupoSolto = (lay, key) => !!(lay && Array.isArray(lay[key + '~1']));
function posicoes(cells, lay){   // casa sem posição salva (item novo) vai para baixo, em fileira
  const out = {}; let m = 0;
  cells.forEach(c => { const p = lay && lay[c.key];
    if (Array.isArray(p) && p.length >= 4) out[c.key] = posClamp(p);
    else { out[c.key] = posClamp([(m % 3) / 3 + .005, 1 - .16 * (Math.floor(m / 3) + 1), .32, .15]); m++; } });
  return out;
}
const pct = v => (Math.round(v * 100000) / 1000) + '%';
function fichaHtml(data, opt){
  opt = opt || {};
  const k = data.kit, cli = clienteById(k.cliente_id) || { nome:'', titulo_ficha:'COMPOSIÇÃO DE JOGOS', rotulo_codigo:'Cód. Cliente' };
  const cfg = S.cfg || {};
  const cells = fichaCells(data, opt.edit && canEdit());
  const cols = cells.length > 8 ? 3 : cells.length > 4 ? 2 : 1;            // até 4 fotos: uma por linha, grandes, como no catálogo
  // grupo grande (10+) ocupa a linha inteira; grupo pequeno fica na própria casa, para a coluna de fotos caber na página
  const larga = c => c.n >= 10 && cols > 1;
  let rows = 0, pos = 0;
  cells.forEach(c => { if (larga(c)){ pos = 0; rows++; } else { if (!pos) rows++; pos = (pos + 1) % cols; } });
  rows = Math.max(1, rows);
  const maxH = Math.max(30, Math.min(190, Math.floor(770 / rows) - 24));
  const grupo = c => { const n = Math.min(c.n, AGRUPAR_MAX), gc = n <= 3 ? n : Math.min(10, Math.ceil(n / 2)), gr = Math.ceil(n / gc);
    const h = Math.max(12, Math.floor((maxH - (gr - 1) * 3) / gr));
    return '<div class="fz-ph grp" data-key="' + esc(c.key) + '"' + (larga(c) ? ' style="grid-column:1 / -1"' : '') + '><span class="n">' + esc(c.label) + '</span><div class="fz-grp" style="grid-template-columns:repeat(' + gc + ',minmax(0,1fr))">'
      + Array.from({ length:n }, () => '<img src="' + esc(c.src) + '" alt="" style="max-height:' + h + 'px">').join('') + '</div>' + (c.n > n ? '<span class="fz-x">× ' + c.n + '</span>' : '') + '</div>'; };
  const vazia = c => '<div class="fz-ph empty"' + (livre ? ' data-key="' + esc(c.key) + '" style="' + estilo(c) + '"' : '') + '><span class="n">' + esc(c.label) + '</span>' + (c.peca && !opt.editLayout ? '<button type="button" class="box" data-act="foto-peca" data-id="' + c.peca.id + '" data-kit="' + k.id + '">+ foto da peça<br>' + esc(c.peca.codigo) + '</button>' : '<span class="box">' + (c.peca ? esc(c.peca.codigo) : 'sem peça') + '</span>') + (opt.editLayout ? '<span class="rs"></span>' : '') + '</div>';
  // posição livre (salva em kits.layout_fotos, ou a do editor de "Ajustar fotos")
  const lay = opt.layout !== undefined ? opt.layout : k.layout_fotos;
  const livre = !!(opt.livre || (lay && typeof lay === 'object' && Object.keys(lay).length));
  const posL = livre ? posicoes(cells, lay) : null;
  const estilo = c => { const p = posL[c.key]; return 'left:' + pct(p[0]) + ';top:' + pct(p[1]) + ';width:' + pct(p[2]) + ';height:' + pct(p[3]); };
  const nd = opt.editLayout ? ' draggable="false"' : '';
  const alcas = opt.editLayout ? '<span class="rs" title="Puxe para mudar o tamanho"></span><span class="rt" title="Toque: gira 90°. Arraste: gira livre">⟳</span>' : '';
  const casaLivre = c => { if (c.empty) return vazia(c);
    const n = Math.min(c.n || 1, AGRUPAR_MAX), [gc, gr] = gradeDe(n), solto = n > 1 && grupoSolto(lay, c.key);
    const copia = i => { let st = '';
      if (solto){ const p = copiaClamp(lay[c.key + '~' + i] || copiaGrade(i, n)); st = ' style="left:' + pct(p[0]) + ';top:' + pct(p[1]) + ';width:' + pct(p[2]) + ';height:' + pct(p[3]) + '"' + (p[4] ? ' data-rot="' + p[4] + '"' : ''); }

    + b('largura', 'Largura da tela', '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h18M7 8l-4 4 4 4M17 8l4 4-4 4"/></svg>') + '</div>'
    + '<button class="vbtn" data-act="print-kit" id="fzvPdf" type="button" aria-label="Gerar o PDF" title="Gerar o PDF">' + IC.print + '</button></div>'
    + '<div class="v-stage fzv-stage" id="fzvStage"><div class="fzv-page" id="fzvPage"></div></div>';

function fzvSet(z){
  const pg = $('#fzvPage'), f = pg && pg.firstElementChild; if (!f) return;
  FZV.z = z = clamp(z, .2, 4);
  pg.style.width = Math.round(794 * z) + 'px'; pg.style.height = Math.round(1123 * z) + 'px'; f.style.transform = 'scale(' + z + ')';
  $('#fzvPct').textContent = Math.round(z * 100) + '%';

function fzvZoom(z, cx, cy){   // o ponto embaixo do cursor (ou o centro) fica parado
  const st = $('#fzvStage'), pg = $('#fzvPage'); if (!st || !pg.firstElementChild) return;
  const rs = st.getBoundingClientRect(), ax = cx == null ? st.clientWidth / 2 : cx - rs.left, ay = cy == null ? st.clientHeight / 2 : cy - rs.top;
  const fx = (st.scrollLeft + ax - pg.offsetLeft) / FZV.z, fy = (st.scrollTop + ay - pg.offsetTop) / FZV.z;

function ligarFzv(st){
  let pan = null, pz = null;
  st.addEventListener('pointerdown', e => {   // mouse: arrastar para andar pela folha (no dedo a rolagem é a normal)
    if (e.pointerType !== 'mouse' || e.button !== 0) return;
    pan = { x:e.clientX, y:e.clientY, l:st.scrollLeft, t:st.scrollTop }; st.classList.add('pan');
    try { st.setPointerCapture(e.pointerId); } catch(err){}
  });
  st.addEventListener('pointermove', e => { if (!pan) return; st.scrollLeft = pan.l - (e.clientX - pan.x); st.scrollTop = pan.t - (e.clientY - pan.y); });
  const fim = () => { pan = null; st.classList.remove('pan'); };
  st.addEventListener('pointerup', fim); st.addEventListener('pointercancel', fim); st.addEventListener('lostpointercapture', fim);
  st.addEventListener('dblclick', e => { e.preventDefault(); fzvZoom(FZV.z < 1.4 ? 2 : fzvFit('pagina'), e.clientX, e.clientY); });
  st.addEventListener('wheel', e => { if (!e.ctrlKey && !e.metaKey) return; e.preventDefault(); fzvZoom(FZV.z * Math.exp(-e.deltaY * .0025), e.clientX, e.clientY); }, { passive:false });   // inclui a pinça do touchpad
  const dist = t => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
  st.addEventListener('touchstart', e => { if (e.touches.length === 2) pz = { d:dist(e.touches), z:FZV.z }; }, { passive:true });
  st.addEventListener('touchmove', e => { if (!pz || e.touches.length !== 2) return; e.preventDefault();
    fzvZoom(pz.z * dist(e.touches) / pz.d, (e.touches[0].clientX + e.touches[1].clientX) / 2, (e.touches[0].clientY + e.touches[1].clientY) / 2); }, { passive:false });
  st.addEventListener('touchend', e => { if (e.touches.length < 2) pz = null; });
}

function refDiff(data){

  const theirs = new Map(); r.i.forEach(t => { if (t[1]) theirs.set(chave(t[1]), [(theirs.get(chave(t[1])) || [0])[0] + Number(t[2] || 0), t[1]]); });
  const out = [];
  theirs.forEach(([q, cod], k) => { if (!mine.has(k)) out.push('<span class="rem" title="está no catálogo e não na ficha">' + esc(cod) + ' ×' + q + '</span>'); else if (mine.get(k) !== q) out.push('<span class="chg" title="qtde diferente">' + esc(cod) + ' ' + q + '→' + mine.get(k) + '</span>'); });

  return { r, out };
}

function setItemFoto(it, f, src){   // f: { path } (arquivo do catálogo no Storage), { blob } ou o arquivo escolhido; null tira
  if (it._foto && it._foto.blob) try { URL.revokeObjectURL(it._foto.url); } catch(e){}
  if (!f){ delete it._foto; return; }
  if (f.path) it._foto = { path:f.path, url:fotoUrl(f.path), src };

function edInput(el){
  const ed = S.editor; if (!ed) return;
  const f = el.dataset.f, i = Number(el.dataset.i);
  ed.dirty = true;
  if (el.dataset.ed === 'k'){
    let v = el.value;
    if (f === 'cliente_id') v = Number(v);
    if (f === 'codigos_alt') v = v.split(',').map(s => s.trim()).filter(Boolean);
    ed.kit[f] = v;
    if (f === 'cod_cliente') $('#edRef').innerHTML = refBox(), hydrate($('#edRef'));
  } else if (el.dataset.ed === 'i'){
    const it = ed.itens[i]; if (!it) return;
    it[f] = f === 'qtde' ? (el.value === '' ? '' : Number(el.value)) : el.value; it.err = '';
    if (f === 'codigo'){
      const p = S.pecaByChave.get(chave(el.value)), rp = !p && refPart(el.value);
      if (!it.aplicacao && (p || rp)){ it.aplicacao = (p ? p.descricao : rp.descricao) || ''; const a = $('[data-ed="i"][data-i="' + i + '"][data-f="aplicacao"]'); if (a) a.value = it.aplicacao; }
    }
    const h = $('#hint' + i); if (h) h.innerHTML = codeHint(it);
    if (f === 'codigo' || f === 'item' || f === 'qtde') drawFotoStrip(i);
    const row = el.closest('.irow'); if (row) row.className = 'irow' + ((!it.codigo || it.qtde === '' || it.qtde == null) ? ' pend' : '');
  } else if (el.dataset.ed === 'f'){
    const ft = ed.fotos[i]; if (!ft) return;
    ft[f] = f === 'itens' ? el.value.split(/[,;\s]+/).map(s => pad2(s)).filter(Boolean) : el.value;
  }
}
async function edSave(){
  const ed = S.editor; if (!ed) return;
  const btn = $('#edSave'); const K = ed.kit;
  ed.itens.forEach(it => { it.item = pad2(it.item); });
  let err = '';
  if (!K.cliente_id) err = 'Escolha o cliente.'; else if (!String(K.cod_cliente || '').trim()) err = 'Informe o código do kit.';
  const seen = new Set();
  ed.itens.forEach(it => { it.err = ''; if (!String(it.item).trim()) it.err = 'Falta o número do item.'; else if (seen.has(it.item)) it.err = 'Número repetido.'; seen.add(it.item);
    if (!it.err && (!String(it.codigo).trim() || it.qtde === '' || it.qtde == null) && !String(it.pendencia || '').trim()) it.err = 'Falta ' + (!String(it.codigo).trim() ? 'o código' : 'a qtde') + ' (ou escreva a pendência).'; });
  if (!err && ed.itens.some(it => it.err)) err = 'Confira os itens marcados em vermelho.';
  if (err){ ed.err = err; $('#edErr').outerHTML = '<div class="errbox" id="edErr">' + esc(err) + '</div>'; drawEdItens(); $('#sheetBody').scrollTop = 0; return; }
  btn.disabled = true; btn.textContent = 'Salvando…';
  const itens = ed.itens.map((it, n) => { const rp = !S.pecaByChave.get(chave(it.codigo)) ? refPart(it.codigo) : null;
    return { item:it.item, codigo:String(it.codigo || '').trim(), qtde:it.qtde === '' ? null : it.qtde, aplicacao:it.aplicacao, espessura:it.espessura, fornecedor:it.fornecedor, cod_item_cliente:it.cod_item_cliente, pendencia:it.pendencia, ordem:n + 1,
      peca_descricao:rp ? rp.descricao : it.aplicacao, peca_familia:rp ? rp.familia : null, peca_predio:rp ? rp.predio : null }; });
  const kit = Object.assign({}, K, { id:ed.id, cliente_id:Number(K.cliente_id), qtd_valor:Number(K.qtd_valor) || 0, pagina:K.pagina === '' ? null : Number(K.pagina) });
  try {
    const id = await DB.saveKit(kit, itens, ed.fotos.map((f, n) => ({ id:f.id || null, caminho:f.caminho, itens:f.itens || [], legenda:f.legenda || '', ordem:n + 1 })));
    // fotos novas dos itens: vão para o cadastro da peça (depois de salvar, porque peça nova só ganha id agora)
    const pend = ed.itens.filter(it => it._foto && String(it.codigo || '').trim());
    let ok = 0, falhou = 0;
    if (pend.length){
      btn.textContent = 'Enviando fotos… 0 de ' + pend.length;
      const salvo = await DB.kit(id).catch(() => null);
      const pecaDo = new Map(((salvo && salvo.itens) || []).map(x => [x.item, x.peca]));
      for (const it of pend){
        const p = pecaDo.get(pad2(it.item));
        try { if (!p) throw new Error('sem peça'); const path = it._foto.path || await DB.upload(it._foto.blob, 'pecas/' + slug(p.codigo) + '-' + Date.now() + '.jpg'); await DB.setPecaFoto(p.id, path); ok++; }
        catch(e){ falhou++; }
        btn.textContent = 'Enviando fotos… ' + (ok + falhou) + ' de ' + pend.length;
      }
      pend.forEach(it => setItemFoto(it, null));
    }
    S.editor = null;
    toast('Ficha ' + K.cod_cliente + ' salva' + (ok ? ' com ' + ok + (ok > 1 ? ' fotos' : ' foto') : '') + '.' + (falhou ? ' ' + falhou + (falhou > 1 ? ' fotos não subiram' : ' foto não subiu') + ': ponha de novo pela ficha.' : ''), null, falhou ? 7000 : 4200);
    await reloadLists();

    const prev = S.stack[S.stack.length - 1];

    renderSheet();
  } catch(e){ ed.err = errMsg(e); btn.disabled = false; btn.innerHTML = IC.save + ' Salvar ficha'; $('#edErr').outerHTML = '<div class="errbox" id="edErr">' + esc(ed.err) + '</div>'; $('#sheetBody').scrollTop = 0; }
}

/* peça repetida: ao pegar uma foto do grupo, as cópias passam a ter lugar próprio (medido na tela, sem pulo) */
function copiaInicio(t, g, gcEl, area){

/* o grupo é sempre a caixa justa em volta das cópias + o número; tudo dentro da área das fotos */
function aplicarCopias(t, g){
  const C = g.C, pd = g.pad, r4 = v => Math.round(v * 10000) / 10000;

  C.forEach((c, j) => { const p = [(c.x - ux) / uw, (c.y - uy) / uh, c.w / uw, c.h / uh].map(r4); if (c.rot) p.push(c.rot);

function readOrder(file){
  if (typeof XLSX === 'undefined'){ toast('O leitor de Excel não carregou.'); return; }
  const fr = new FileReader();
  fr.onload = e => {
    try {
      const wb = XLSX.read(new Uint8Array(e.target.result), { type:'array' }); const sheets = [];
      for (const name of wb.SheetNames){
        const rows = XLSX.utils.sheet_to_json(wb.Sheets[name], { header:1, defval:'' }); if (!rows.length) continue;
        let hi = -1, ci = -1;
        for (let i = 0; i < Math.min(rows.length, 10) && hi < 0; i++) rows[i].forEach((c, j) => { const h = norm(c).replace(/[^A-Z]/g, ''); if (ci < 0 && /^(ITEM|CODIGO|COD|CODSABO|CODIGOSABO|CODCLIENTE|PRODUTO|REFERENCIA|SABO|KIT)$/.test(h)){ hi = i; ci = j; } });
        if (hi < 0) continue;
        const header = rows[hi]; const data = rows.slice(hi + 1).filter(r => String(r[ci]).trim() && /\d/.test(String(r[ci])));
        if (!data.length) continue;
        const qtyCols = [];
        header.forEach((h, j) => { if (j === ci) return; const n = data.filter(r => r[j] !== '' && !isNaN(Number(String(r[j]).replace(',', '.')))).length; if (n >= Math.max(1, data.length * 0.3)) qtyCols.push({ idx:j, name:String(h || ('Coluna ' + (j + 1))) }); });
        const pref = [/QTD|QUANT/, /PEDIDO|TOTAL/, /PREV/].reduce((f, re) => f || qtyCols.find(c => re.test(norm(c.name))), null);
        sheets.push({ name, rows:data, codeIdx:ci, codeHeader:String(header[ci]), qtyCols, defQty:pref ? pref.idx : (qtyCols[0] ? qtyCols[0].idx : -1) });
      }
      if (!sheets.length){ toast('Não achei uma coluna "Item" ou "Código" com códigos de kit nesse arquivo.'); return; }
      S.pendingImport = { name:file.name, sheets }; pushSheet({ type:'import' });
    } catch(err){ toast('Não consegui ler esse arquivo: ' + err.message); }
  };
  fr.readAsArrayBuffer(file);
}
function doImport(){
  const pi = S.pendingImport; if (!pi) return;
  const idx = new Map(); S.kits.forEach(k => { idx.set(kitKey(k.cod_cliente), k.id); (k.codigos_alt || []).forEach(a => { if (!idx.has(kitKey(a))) idx.set(kitKey(a), k.id); }); });
  const acc = new Map(), miss = new Map(); let lines = 0;
  pi.sheets.forEach((s, i) => {
    const sel = $('select[data-imp="' + i + '"]'); const qi = sel ? Number(sel.value) : -1; if (qi < 0) return;
    s.rows.forEach(r => { const raw = r[s.codeIdx]; const q = Number(String(r[qi]).replace(',', '.')) || 0; if (!q) return; lines++;
      const id = idx.get(kitKey(typeof raw === 'number' ? String(raw) : raw)); if (id) acc.set(id, (acc.get(id) || 0) + q); else miss.set(String(raw), (miss.get(String(raw)) || 0) + q); });
  });
  acc.forEach((q, id) => { const l = S.calc.linhas.find(x => x.kit_id === id); if (l) l.qtde += Math.round(q); else S.calc.linhas.push({ kit_id:id, qtde:Math.round(q) }); });
  calcSave(); S.pendingImport = null; S.stack = []; renderSheet(); go('calculadora'); runCalc();
  toast(acc.size + ' kits importados de ' + lines + ' linhas' + (miss.size ? '. Não cadastrados: ' + Array.from(miss.keys()).slice(0, 6).join(', ') + (miss.size > 6 ? '…' : '') : '.'), null, 9000);
}

async function subirImagensCatalogo(btn){
  const file = await pickFile('.zip,application/zip'); if (!file) return;
  if (typeof JSZip === 'undefined') await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js');
  btn.textContent = 'Abrindo o .zip…';
  const zip = await JSZip.loadAsync(file), fila = [];
  zip.forEach((path, f) => { if (f.dir) return; const m = path.match(/(?:^|\/)(fotos|etiquetas)\/([^/]+\.webp)$/i); if (m) fila.push({ f, dest:'referencia/' + m[1].toLowerCase() + '/' + m[2] }); });
  if (!fila.length) throw Object.assign(new Error('Esse .zip não tem as pastas fotos/ e etiquetas/ do catálogo.'), { friendly:true });
  const total = fila.length; let feitos = 0, falhas = 0;
  const vez = async () => { while (fila.length){ const it = fila.shift();
    try { const b = await it.f.async('uint8array'); await DB.uploadRaw(new Blob([b], { type:'image/webp' }), it.dest, 'image/webp'); } catch(e){ falhas++; }

const reFocus = (sel, fn) => debounce(() => { const el = $(sel); const pos = el ? el.selectionStart : null; fn(); const n = $(sel); if (n){ n.focus(); try { n.setSelectionRange(pos, pos); } catch(err){} } }, 160);

function peInput(el){
  const ed = S.editor; if (!ed) return; ed.dirty = true;
  if (el.dataset.pe === 'p'){ ed.p[el.dataset.f] = el.value; if (el.dataset.f === 'tipo'){ const s = $('#peComps'); if (s) s.hidden = el.value !== 'subkit'; } }
  else { const c = ed.comps[Number(el.dataset.i)]; if (c){ c[el.dataset.f] = el.dataset.f === 'qtde' ? el.value : el.value; const hint = el.parentElement.querySelector('.chint'); if (hint && el.dataset.f === 'codigo') hint.innerHTML = el.value ? (S.pecaByChave.get(chave(el.value)) ? '<span class="ok">✓</span>' + esc(S.pecaByChave.get(chave(el.value)).descricao || '') : '<span class="new">Peça nova</span> será cadastrada') : ''; } }
}
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'kitsQ') return onKitsQ();
