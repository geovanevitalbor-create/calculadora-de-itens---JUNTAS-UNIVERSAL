  return api;
}

/* ================= banco: Supabase ================= */
function SupaStore(){
  const sb = window.supabase.createClient(CONFIG.supabaseUrl, CONFIG.supabaseKey, { auth:{ persistSession:true, autoRefreshToken:true, storageKey:'ju-calc-auth' } });
  const friendly = e => {
    const m = (e && (e.message || e.error_description || e.msg)) || String(e);
    if (/row-level security|permission denied/i.test(m)) return 'Sem permissão para isso (peça para um admin liberar o papel de editor).';
    if (/duplicate key.*kits_codigo_unico/i.test(m)) return 'Já existe um kit com esse código para esse cliente.';
    if (/duplicate key.*pecas_chave_unica/i.test(m)) return 'Já existe uma peça com esse código.';
    if (/violates foreign key.*kit_itens|still referenced/i.test(m)) return 'Esse registro está em uso e não pode ser apagado.';
    if (/Failed to fetch|NetworkError|Load failed/i.test(m)) return 'Sem conexão com o banco. Confira a internet e tente de novo.';
    if (/Invalid login credentials/i.test(m)) return 'E-mail ou senha incorretos.';
    if (/Email not confirmed/i.test(m)) return 'Esse e-mail ainda não foi confirmado.';
    return m;
  };
  const q = async p => { const { data, error } = await p; if (error){ const e = new Error(friendly(error)); e.friendly = true; e.raw = error; throw e; } return data; };
  async function fetchAll(table, select, order){
    let out = [], from = 0;
    for (;;){ const rows = await q(sb.from(table).select(select).order(order).range(from, from + 999)); out = out.concat(rows); if (rows.length < 1000) break; from += 1000; }
    return out;
  }
  const PECA_COLS = 'id,codigo,chave,descricao,tipo,familia,predio,fornecedor,espessura,material,unidade,foto_path,obs,ativo';
  const api = {
    sb,
    async session(){ const { data } = await sb.auth.getSession(); return data.session; },
    async publicConfig(){ try { const r = await q(sb.from('config').select('*').limit(1)); return r[0] || {}; } catch(e){ return {}; } },
    async signIn(email, password){ await q(sb.auth.signInWithPassword({ email, password })); },
    async signOut(){ await sb.auth.signOut(); },
    async resetPassword(email){ await q(sb.auth.resetPasswordForEmail(email, { redirectTo:location.href.split('#')[0] })); },
    async updatePassword(password){ await q(sb.auth.updateUser({ password })); },
    onAuth(cb){ sb.auth.onAuthStateChange((ev, session) => cb(ev, session)); },
    async init(){
      const ses = await api.session();
      const [cfg, clientes, predios, familias] = await Promise.all([
        q(sb.from('config').select('*').limit(1)).then(r => r[0] || {}),
        q(sb.from('clientes').select('*').order('nome')), q(sb.from('predios').select('*').order('ordem')), q(sb.from('familias').select('*').order('nome'))]);
      let me = null;
      if (ses){ const r = await q(sb.from('perfis').select('*').eq('id', ses.user.id)); me = r[0] || { id:ses.user.id, nome:ses.user.email, email:ses.user.email, papel:'leitor', avisos_vistos_em:nowIso() }; }
      else me = { id:null, nome:'Visitante', email:'', papel:'visitante', avisos_vistos_em:nowIso() };
      return { cfg, me, clientes, predios, familias };
    },
    kits: () => fetchAll('v_kits', '*', 'cod_cliente'),
    pecas: () => fetchAll('v_pecas', '*', 'codigo'),
    async kit(id){
      const k = await q(sb.from('kits').select('*, kit_itens(*, peca:pecas(' + PECA_COLS + ')), kit_fotos(*)').eq('id', id).single());
      const itens = (k.kit_itens || []).sort((a, b) => a.ordem - b.ordem || a.item.localeCompare(b.item, 'pt-BR', { numeric:true }));
      const fotos = (k.kit_fotos || []).sort((a, b) => a.ordem - b.ordem || a.id - b.id);
      delete k.kit_itens; delete k.kit_fotos;
      return { kit:k, itens, fotos };
    },
    async kitsFull(ids){
      const out = [];
      for (let i = 0; i < ids.length; i += 60){
        const rows = await q(sb.from('kits').select('*, kit_itens(*, peca:pecas(' + PECA_COLS + ')), kit_fotos(*)').in('id', ids.slice(i, i + 60)));
        rows.forEach(k => { const itens = (k.kit_itens || []).sort((a, b) => a.ordem - b.ordem || a.item.localeCompare(b.item, 'pt-BR', { numeric:true })); const fotos = (k.kit_fotos || []).sort((a, b) => a.ordem - b.ordem || a.id - b.id); delete k.kit_itens; delete k.kit_fotos; out.push({ kit:k, itens, fotos }); });
      }
      return out;
    },
    saveKit: (k, itens, fotos) => q(sb.rpc('salvar_kit', { p_kit:k, p_itens:itens, p_fotos:fotos == null ? null : fotos })),
    setKitStatus: (id, st) => q(sb.from('kits').update({ status:st }).eq('id', id)),
    duplicateKit: (id, cod) => q(sb.rpc('duplicar_kit', { p_kit_id:id, p_novo_cod:cod })),
    deleteKit: id => q(sb.from('kits').delete().eq('id', id)),
    async peca(id){
      const p = await q(sb.from('pecas').select(PECA_COLS + ', comps:peca_componentes!peca_componentes_subkit_id_fkey(componente_id, qtde, ordem, peca:pecas!peca_componentes_componente_id_fkey(' + PECA_COLS + '))').eq('id', id).single());
      const comps = (p.comps || []).sort((a, b) => a.ordem - b.ordem); delete p.comps;
      return { peca:p, comps };
    },
    savePeca: (p, comps) => q(sb.rpc('salvar_peca', { p_peca:p, p_componentes:comps == null ? null : comps })),
    deletePeca: id => q(sb.from('pecas').delete().eq('id', id)),
    setPecaFoto: (id, path) => q(sb.from('pecas').update({ foto_path:path }).eq('id', id)),
    async upload(blob, path){
      const small = await resizeImage(blob, 1400, 0.85);
      await q(sb.storage.from(CONFIG.bucket).upload(path, small.blob, { contentType:'image/jpeg', upsert:true, cacheControl:'3600' }));
      return path;
    },
    url: path => /^(https?:|data:)/.test(path) ? path : CONFIG.supabaseUrl + '/storage/v1/object/public/' + CONFIG.bucket + '/' + String(path).split('/').map(encodeURIComponent).join('/'),
    explode: lista => q(sb.rpc('explodir_lista', { p_itens:lista })),
    ondeUsa: pid => q(sb.rpc('onde_usa', { p_peca_id:pid })),
    pendencias: () => fetchAll('v_pendencias', '*', 'tipo'),
    async historico(f){
      let b = sb.from('historico').select('*').order('em', { ascending:false }).limit(40);
      b = f.kit_id ? b.eq('kit_id', f.kit_id) : b.eq('peca_id', f.peca_id);
      const rows = await q(b);
      return rows.map(h => Object.assign(h, { resumo:histResumo(h) }));
    },
    avisos: () => q(sb.from('avisos').select('*').order('em', { ascending:false }).limit(60)),
    async marcarLidos(){ const t = nowIso(); if (S.me && S.me.id) await q(sb.from('perfis').update({ avisos_vistos_em:t }).eq('id', S.me.id)); return t; },
    async producoes(){
      const rows = await q(sb.from('producoes').select('*, producao_kits(kit_id, qtde)').order('criado_em', { ascending:false }).limit(80));
      return rows.map(p => Object.assign(p, { linhas:(p.producao_kits || []).map(x => ({ kit_id:x.kit_id, qtde:Number(x.qtde) })) }));
    },
    async saveProducao(nome, linhas, id){
      if (id){ await q(sb.from('producoes').update({ nome }).eq('id', id)); await q(sb.from('producao_kits').delete().eq('producao_id', id)); }
      else { const r = await q(sb.from('producoes').insert({ nome }).select('id').single()); id = r.id; }
      if (linhas.length) await q(sb.from('producao_kits').insert(linhas.map(l => ({ producao_id:id, kit_id:l.kit_id, qtde:l.qtde }))));
      return id;
    },
    deleteProducao: id => q(sb.from('producoes').delete().eq('id', id)),
    usuarios: () => q(sb.from('perfis').select('*').order('nome')),
    definirPapel: (id, papel) => q(sb.rpc('definir_papel', { p_usuario:id, p_papel:papel })),
    saveConfig: c => q(sb.from('config').update(c).eq('id', true)),
    saveCliente: c => c.id ? q(sb.from('clientes').update({ nome:c.nome, titulo_ficha:c.titulo_ficha, rotulo_codigo:c.rotulo_codigo, logo_path:c.logo_path }).eq('id', c.id))
                           : q(sb.from('clientes').insert({ nome:c.nome, titulo_ficha:c.titulo_ficha, rotulo_codigo:c.rotulo_codigo })),
    addLookup: (tab, nome) => q(sb.from(tab).insert(tab === 'predios' ? { nome, ordem:99 } : { nome })),
    subscribe(onAviso, onKit){
      try {
        sb.channel('ju-tempo-real')
          .on('postgres_changes', { event:'INSERT', schema:'public', table:'avisos' }, p => onAviso(p.new))
          .on('postgres_changes', { event:'*', schema:'public', table:'kits' }, () => onKit())
          .subscribe();
      } catch(e){}
    },
  };
  return api;
}
function histResumo(h){
  const a = h.antes || {}, n = h.depois || {};
  if (h.acao === 'INSERT') return { kits:'Kit cadastrado', kit_itens:'Item ' + (n.item || '') + ' incluído', kit_fotos:'Foto incluída', pecas:'Peça cadastrada', peca_componentes:'Peça incluída no sub-kit' }[h.tabela] || 'Incluído';
  if (h.acao === 'DELETE') return { kits:'Kit apagado', kit_itens:'Item ' + (a.item || '') + ' retirado', kit_fotos:'Foto retirada', pecas:'Peça apagada', peca_componentes:'Peça retirada do sub-kit' }[h.tabela] || 'Apagado';
  const ch = Object.keys(n).filter(k => JSON.stringify(n[k]) !== JSON.stringify(a[k]));
  const LBL = { status:'status', descricao:'descrição', qtde:'qtde', peca_id:'peça', aplicacao:'aplicação', embalagem:'embalagem', observacao:'observação', etiqueta:'etiqueta', foto_path:'foto', predio:'prédio', familia:'família', codigo:'código', revisao:'revisão', itens:'itens da foto', pendencia:'pendência' };
  if (ch.includes('status')) return 'Status: ' + ((STATUS[a.status] || {}).l || a.status) + ' → ' + ((STATUS[n.status] || {}).l || n.status) + (n.status === 'aprovado' ? ' (revisão ' + n.revisao + ')' : '');
  const pre = h.tabela === 'kit_itens' ? 'Item ' + (n.item || a.item) + ': ' : '';
  return pre + (ch.filter(k => k !== 'revisao' && k !== 'aprovado_em' && k !== 'aprovado_por').map(k => LBL[k] || k).join(', ') || 'alterado');
}

/* ---------- ficha (visualizar) ---------- */
function refDiff(data){
  const r = refKit(data.kit.cod_cliente); if (!r) return null;
  const mine = new Map(); data.itens.forEach(i => { if (i.peca) mine.set(chave(i.peca.codigo), (mine.get(chave(i.peca.codigo)) || 0) + Number(i.qtde || 0)); });
  const theirs = new Map(); r.i.forEach(t => { if (t[1]) theirs.set(chave(t[1]), [(theirs.get(chave(t[1])) || [0])[0] + Number(t[2] || 0), t[1]]); });
  const out = [];
  theirs.forEach(([q, cod], k) => { if (!mine.has(k)) out.push('<span class="rem" title="está no catálogo e não na ficha">' + esc(cod) + ' ×' + q + '</span>'); else if (mine.get(k) !== q) out.push('<span class="chg" title="qtde diferente">' + esc(cod) + ' ' + q + '→' + mine.get(k) + '</span>'); });
  mine.forEach((q, k) => { if (!theirs.has(k)){ const it = data.itens.find(i => i.peca && chave(i.peca.codigo) === k); out.push('<span class="add" title="está na ficha e não no catálogo">' + esc(it.peca.codigo) + ' ×' + q + '</span>'); } });
  return { r, out };
}

/* ================= mensagens ================= */
function toast(msg, action, ms){
  const host = $('#toasts'); const el = document.createElement('div'); el.className = 'toast';
  el.innerHTML = '<span>' + esc(msg) + '</span>' + (action ? '<button type="button">' + esc(action.label) + '</button>' : '');
  if (action) el.querySelector('button').addEventListener('click', () => { el.remove(); action.fn(); });
  host.appendChild(el); while (host.children.length > 3) host.firstChild.remove();
  setTimeout(() => el.remove(), ms || 4200);
}
const errMsg = e => (e && (e.friendly || e.message)) ? e.message : 'Algo deu errado: ' + String(e);
const armed = new Map();
function arm(key, msg){ const t = armed.get(key) || 0; if (Date.now() < t){ armed.delete(key); return true; } armed.set(key, Date.now() + 4000); toast(msg, null, 4000); return false; }
function setDb(text, on){ const l = $('#dbLine'); if (!l) return; l.classList.toggle('on', !!on); l.querySelector('span').textContent = text; }

async function saveFile(name, wb){
  if (typeof XLSX === 'undefined'){ toast('O gerador de Excel não carregou.'); return; }
  if (S.downloads){
    try { const buf = XLSX.write(wb, { bookType:'xlsx', type:'array', compression:true }); await S.downloads.save({ filename:name, data:new Uint8Array(buf) }); toast('Arquivo salvo: ' + name); }
    catch(e){ if (!(e && e.code === 'declined')) toast('Não consegui gerar o arquivo.'); }
    return;
  }
  try { XLSX.writeFile(wb, name, { compression:true }); } catch(e){ toast('Não consegui gerar o arquivo.'); }
}
function exportCalc(){
  const R = S.calc.result || []; if (!R.length){ toast('Nada para exportar.'); return; }
  const a = [['Prédio', 'Código', 'Descrição', 'Família', 'Fornecedor', 'Qtde total', 'Kits', 'Pendência']];
  R.slice().sort((x, y) => (x.predio || 'ZZZ').localeCompare(y.predio || 'ZZZ') || String(x.codigo).localeCompare(String(y.codigo), 'pt-BR', { numeric:true }))
    .forEach(r => a.push([r.predio || (r.pendencia ? '' : 'Sem prédio'), r.codigo, r.descricao || '', r.familia || '', r.fornecedor || '', Number(r.qtde), r.kits || '', r.pendencia || '']));
  const b = [['Kit', 'Descrição', 'Situação', 'Qtde de jogos']];
  S.calc.linhas.forEach(l => { const k = S.kitById.get(l.kit_id); if (k) b.push([k.cod_cliente, k.descricao || '', STATUS[k.status].l, l.qtde]); });
  const wb = XLSX.utils.book_new();
  const s1 = XLSX.utils.aoa_to_sheet(a); s1['!cols'] = [{ wch:12 }, { wch:20 }, { wch:36 }, { wch:16 }, { wch:14 }, { wch:11 }, { wch:40 }, { wch:40 }];
  const s2 = XLSX.utils.aoa_to_sheet(b); s2['!cols'] = [{ wch:14 }, { wch:60 }, { wch:14 }, { wch:12 }];
  XLSX.utils.book_append_sheet(wb, s1, 'Itens a fabricar'); XLSX.utils.book_append_sheet(wb, s2, 'Produção');
  saveFile('itens-a-fabricar-' + new Date().toISOString().slice(0, 10) + '.xlsx', wb);
}
function downloadTemplate(){
  if (typeof XLSX === 'undefined'){ toast('O gerador de Excel não carregou.'); return; }
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([['Item', 'Quantidade'], ['9904331', 100], ['75.092', 30]]), 'Pedido');
  saveFile('modelo-pedido.xlsx', wb);
}
function readOrder(file){
  if (typeof XLSX === 'undefined'){ toast('O leitor de Excel não carregou.'); return; }
  const fr = new FileReader();
  fr.onload = e => {
    try {
      const wb = XLSX.read(new Uint8Array(e.target.result), { type:'array' }); const sheets = [];
      for (const name of wb.SheetNames){
        const rows = XLSX.utils.sheet_to_json(wb.Sheets[name], { header:1, defval:'' }); if (!rows.length) continue;
        let hi = -1, ci = -1;
        for (let i = 0; i < Math.min(rows.length, 10) && hi < 0; i++) rows[i].forEach((c, j) => { const h = norm(c).replace(/[^A-Z]/g, ''); if (ci < 0 && /^(ITEM|CODIGO|COD|CODSABO|CODIGOSABO|CODCLIENTE|PRODUTO|REFERENCIA|SABO|KIT)$/.test(h)){ hi = i; ci = j; } });
        if (hi < 0) continue;
        const header = rows[hi]; const data = rows.slice(hi + 1).filter(r => String(r[ci]).trim() && /\d/.test(String(r[ci])));
        if (!data.length) continue;
        const qtyCols = [];
        header.forEach((h, j) => { if (j === ci) return; const n = data.filter(r => r[j] !== '' && !isNaN(Number(String(r[j]).replace(',', '.')))).length; if (n >= Math.max(1, data.length * 0.3)) qtyCols.push({ idx:j, name:String(h || ('Coluna ' + (j + 1))) }); });
        const pref = [/QTD|QUANT/, /PEDIDO|TOTAL/, /PREV/].reduce((f, re) => f || qtyCols.find(c => re.test(norm(c.name))), null);
        sheets.push({ name, rows:data, codeIdx:ci, codeHeader:String(header[ci]), qtyCols, defQty:pref ? pref.idx : (qtyCols[0] ? qtyCols[0].idx : -1) });
      }
      if (!sheets.length){ toast('Não achei uma coluna "Item" ou "Código" com códigos de kit nesse arquivo.'); return; }
      S.pendingImport = { name:file.name, sheets }; pushSheet({ type:'import' });
    } catch(err){ toast('Não consegui ler esse arquivo: ' + err.message); }
  };
  fr.readAsArrayBuffer(file);
}
function doImport(){
  const pi = S.pendingImport; if (!pi) return;
  const idx = new Map(); S.kits.forEach(k => { idx.set(kitKey(k.cod_cliente), k.id); (k.codigos_alt || []).forEach(a => { if (!idx.has(kitKey(a))) idx.set(kitKey(a), k.id); }); });
  const acc = new Map(), miss = new Map(); let lines = 0;
  pi.sheets.forEach((s, i) => {
    const sel = $('select[data-imp="' + i + '"]'); const qi = sel ? Number(sel.value) : -1; if (qi < 0) return;
    s.rows.forEach(r => { const raw = r[s.codeIdx]; const q = Number(String(r[qi]).replace(',', '.')) || 0; if (!q) return; lines++;
      const id = idx.get(kitKey(typeof raw === 'number' ? String(raw) : raw)); if (id) acc.set(id, (acc.get(id) || 0) + q); else miss.set(String(raw), (miss.get(String(raw)) || 0) + q); });
  });
  acc.forEach((q, id) => { const l = S.calc.linhas.find(x => x.kit_id === id); if (l) l.qtde += Math.round(q); else S.calc.linhas.push({ kit_id:id, qtde:Math.round(q) }); });
  calcSave(); S.pendingImport = null; S.stack = []; renderSheet(); go('calculadora'); runCalc();
  toast(acc.size + ' kits importados de ' + lines + ' linhas' + (miss.size ? '. Não cadastrados: ' + Array.from(miss.keys()).slice(0, 6).join(', ') + (miss.size > 6 ? '…' : '') : '.'), null, 9000);
}

  const ed = S.editor; if (!ed) return; ed.dirty = true;
  if (el.dataset.pe === 'p'){ ed.p[el.dataset.f] = el.value; if (el.dataset.f === 'tipo'){ const s = $('#peComps'); if (s) s.hidden = el.value !== 'subkit'; } }
  else { const c = ed.comps[Number(el.dataset.i)]; if (c){ c[el.dataset.f] = el.dataset.f === 'qtde' ? el.value : el.value; const hint = el.parentElement.querySelector('.chint'); if (hint && el.dataset.f === 'codigo') hint.innerHTML = el.value ? (S.pecaByChave.get(chave(el.value)) ? '<span class="ok">✓</span>' + esc(S.pecaByChave.get(chave(el.value)).descricao || '') : '<span class="new">Peça nova</span> será cadastrada') : ''; } }
}
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'kitsQ') return onKitsQ();
  if (t.id === 'pecasQ') return onPecasQ();
  if (t.id === 'refQ') return onRefQ();
  if (t.id === 'calcQ') return calcSuggest();
  if (t.dataset.calcQ != null){ const l = S.calc.linhas[Number(t.dataset.calcQ)]; if (l){ l.qtde = Math.max(0, Number(t.value) || 0); calcSave(); runCalc(); const L = S.calc.linhas; $('#calcCount').textContent = L.length + ' kits · ' + fmt(L.reduce((a, x) => a + x.qtde, 0)) + ' jogos'; } return; }
  if (t.dataset.ed) return edInput(t);
  if (t.dataset.pe) return peInput(t);
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'orderFile' && t.files && t.files[0]) return readOrder(t.files[0]);
  if (t.id === 'demoRole') return withBusy(null, async () => { await DB.setDemoRole(t.value); const b = await DB.init(); S.me = b.me; S.stack = []; renderSheet(); renderNav(); renderView(); toast('Agora você está como ' + t.value + '.'); });
  if (t.dataset.papel) return withBusy(t, async () => { await DB.definirPapel(t.dataset.papel, t.value); toast('Papel atualizado.'); if (S.me && t.dataset.papel === S.me.id){ S.me.papel = t.value; renderNav(); } });
  if (t.tagName === 'SELECT' && t.dataset.ed) return edInput(t);
  if (t.tagName === 'SELECT' && t.dataset.pe) return peInput(t);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape'){ if ($('#viewer').classList.contains('open')) return closeViewer(); if (S.stack.length) return popSheet(); }
  if (e.target.id === 'calcQ' && e.key === 'Enter'){ e.preventDefault(); ACT['calc-add'](); }
  if (e.target.id === 'dupCod' && e.key === 'Enter'){ e.preventDefault(); const b = $('[data-act="dup-do"]'); if (b) b.click(); }
});
document.addEventListener('submit', e => {
  if (e.target.id !== 'loginForm') return; e.preventDefault();
  const btn = e.target.querySelector('button[type="submit"]');
  withBusy(btn, async () => { await DB.signIn($('#lgEmail').value.trim(), $('#lgPass').value); await start(); }).catch(() => {});
});
(function pinch(){
  let d0 = 0, z0 = 1;
  document.addEventListener('touchstart', e => { if (!$('#viewer').classList.contains('open') || e.touches.length !== 2) return; d0 = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY); z0 = V.zoom; }, { passive:true });
  document.addEventListener('touchmove', e => { if (!d0 || e.touches.length !== 2) return; e.preventDefault(); const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY); V.zoom = Math.min(4, Math.max(1, z0 * d / d0)); applyZoom(); }, { passive:false });
  document.addEventListener('touchend', e => { if (e.touches.length < 2) d0 = 0; });
})();

/* ================= início ================= */
let DB = null;
function renderLogin(msg, pub){
  document.body.classList.add('auth-off');
  $('#view').innerHTML = '<div class="login"><form class="box" id="loginForm" autocomplete="on"><div class="brand"><span class="brandmark">JU</span><div><b>Calculadora de Fabricação</b><span>Juntas Universal</span></div></div>'
    + (msg ? '<div class="errbox">' + esc(msg) + '</div>' : '')
    + '<label class="lbl">E-mail<input class="field" id="lgEmail" type="email" autocomplete="username" required></label>'
    + '<label class="lbl">Senha<input class="field" id="lgPass" type="password" autocomplete="current-password" required></label>'
    + '<button class="btn primary" type="submit">Entrar</button><button class="btn ghost small" type="button" data-act="lg-forgot">Esqueci a senha</button>'
    + (pub ? '<button class="btn small" type="button" data-act="lg-public">Só consultar, sem entrar</button>' : '') + '</form></div>';
}
function setupHtml(msg){
  return '<div class="card" style="max-width:720px;margin:24px auto;display:flex;flex-direction:column;gap:12px"><h2 style="font-size:24px">Falta preparar o banco</h2>'
    + '<p style="margin:0">A página abriu, mas não conseguiu ler as tabelas no Supabase.</p><ol style="margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px"><li>No Supabase, abra <b>SQL Editor</b> e rode o arquivo <span class="mono">criar_banco_calculadora.sql</span> inteiro.</li><li>Em <b>Authentication → Users</b>, crie seu usuário (o primeiro vira admin).</li><li>Recarregue esta página.</li></ol>'
    + '<p class="muted" style="margin:0;font-size:13px">Detalhe técnico: ' + esc(msg) + '</p><div><button class="btn primary" type="button" onclick="location.reload()">Tentar de novo</button></div></div>';
}
let started = false;
async function start(){
  document.body.classList.remove('auth-off');
  $('#view').innerHTML = '<div class="loading">Carregando cadastro…</div>';
  try {
    const b = await DB.init();
    Object.assign(S, { cfg:b.cfg || {}, me:b.me, clientes:b.clientes || [], predios:b.predios || [], familias:b.familias || [] });
    await reloadLists();
    S.avisos = await DB.avisos().catch(() => []);
  } catch(e){
    $('#view').innerHTML = S.mode === 'supabase' ? setupHtml(errMsg(e)) : '<div class="card empty">Não consegui abrir: ' + esc(errMsg(e)) + '</div>';
    setDb('Banco com problema', false); return;
  }
  setDb(S.mode === 'demo' ? 'Demonstração (navegador)' : 'Supabase · conectado', S.mode !== 'demo');
  calcLoad();
  const h = location.hash.slice(1); go(VIEWS[h] ? h : 'kits');
  runCalc();
  if (!started && S.mode === 'supabase' && DB.subscribe){
    DB.subscribe(a => { S.avisos.unshift(a); renderNav(); if (!S.me || a.por_nome !== S.me.nome) toast(a.titulo); }, debounce(() => reloadLists({ pend:false }), 1500));
  }
  started = true;
}
async function probeRef(){
  // usa a primeira pasta que tiver as páginas do catálogo: junto do index.html (GitHub) ou no Storage do Supabase
  for (const base of [CONFIG.refImgBase, CONFIG.refImgAlt].filter(Boolean)){
    const ok = await new Promise(r => { const im = new Image(); const t = setTimeout(() => r(false), 4000); im.onload = () => { clearTimeout(t); r(true); }; im.onerror = () => { clearTimeout(t); r(false); }; im.src = base + 's000.webp'; });
    if (ok){ CONFIG.refImgBase = base; return; }
  }
}
(async function boot(){
  const th = lsGet('ju_theme', null); if (th) document.documentElement.dataset.theme = th;
  if (IN_ARTIFACT){ try { S.downloads = await window.claude.use('downloads'); } catch(e){} }
  if (S.mode === 'demo'){ DB = LocalStore(); await start(); return; }
  if (!window.supabase){ $('#view').innerHTML = setupHtml('A biblioteca do Supabase não carregou (internet bloqueando cdn.jsdelivr.net?).'); return; }
  DB = SupaStore();
  DB.onAuth(ev => { if (ev === 'PASSWORD_RECOVERY') pushSheet({ type:'novasenha' }); });
  setDb('Supabase · entrando…', false);
  let ses = null; try { [, ses] = await Promise.all([probeRef(), DB.session()]); } catch(e){}
  if (ses) return start();
  const cfg = await DB.publicConfig();
  renderLogin('', !!cfg.leitura_publica);
})();
})();
</script>
